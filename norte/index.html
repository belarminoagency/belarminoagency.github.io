<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1217">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: sóbrio, maduro, acolhedor — um caderno que conversa com você
   IDEA: a estrela do norte; cada área tem a cor da emoção que ela trabalha
   PICTURE: capas coloridas com onda e formas flutuando; rostinhos de humor desenhados
   COLOUR and TYPE: início nascer do sol (coral→lilás = esperança), desabafo lavanda (acolhimento), metas verde-água (crescimento), noite índigo (reflexão), missões âmbar (alegria), respira azul-céu (calma); Fraunces + Nunito
   LAYOUT: app de coluna única, menu ☰ à esquerda, barra inferior com 3 abas */
:root{color-scheme:dark;--bg:#0e1217;--ink:#e8edf2;--mut:#8b97a6;--line:#26303c;--card:#18202a;--sf:#212b37;--ac:#4fb3a5;--gold:#d4a24c;
--sun1:#ff8a6b;--sun2:#b28dff;--lav1:#7b5cff;--lav2:#b9a2ff;--tea1:#0fa89a;--tea2:#4fd8c4;--ind1:#232560;--ind2:#5b4fcf;--amb1:#ffab3d;--amb2:#ff7a59;--sky1:#3d8bff;--sky2:#8fd0ff}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;line-height:1.08;margin:0;text-wrap:balance;font-weight:400;letter-spacing:-.01em}
h1{font-size:clamp(32px,9vw,42px)}h2{font-size:26px}h3{font-size:20px}
p{margin:0}
button{font:inherit;font-weight:800;border:0;cursor:pointer;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ffc23d;outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;width:100%;background:var(--sf);color:var(--ink);border:2px solid transparent;border-radius:16px;padding:13px 14px}
input:focus,textarea:focus{border-color:var(--ac);background:#1d2631;outline:none}
textarea{resize:vertical;min-height:140px}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.cover{position:relative;color:var(--ink);border-bottom:1px solid var(--line);padding:18px 20px 64px;overflow:hidden;border-radius:0 0 34px 34px;isolation:isolate}
.cover::before{content:"";position:absolute;right:-90px;top:-110px;width:340px;height:340px;background:radial-gradient(circle,#4fb3a52e,transparent 65%);z-index:-1}.cover .shape{position:absolute;border-radius:40%;opacity:.06;background:var(--ac);z-index:-1;animation:float 9s ease-in-out infinite}
.cover .s1{width:180px;height:180px;right:-50px;top:-40px}.cover .s2{width:90px;height:90px;left:-20px;bottom:10px;animation-delay:-3s;border-radius:50%}.cover .s3{width:46px;height:46px;right:30%;bottom:30px;animation-delay:-5s;border-radius:14px;opacity:.1}
@keyframes float{50%{transform:translateY(-14px) rotate(14deg)}}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.ib{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:#ffffff10;border:1px solid var(--line)}
.ib svg{width:22px;height:22px}
.kicker{font-weight:800;opacity:.9;font-size:15px}
.sub{opacity:.92;margin-top:8px;font-size:16px;max-width:32ch}
.g-sun,.g-lav,.g-tea,.g-ind,.g-amb,.g-sky{background:linear-gradient(165deg,#1c2530 0%,#121820 100%)}
.btn.g-sun,.btn.g-lav,.btn.g-tea,.btn.g-ind,.btn.g-amb,.btn.g-sky,.fab{background:var(--ac)!important;color:#0b1210!important}




.body{padding:0 16px;margin-top:-40px;position:relative}
.card{background:var(--card);border-radius:24px;padding:18px;border:1px solid var(--line);margin-bottom:14px}
.in{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.mut{color:var(--mut);font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{min-height:50px;padding:0 20px;border-radius:16px;color:#0e1217;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px;flex:none}.tile>svg:not(.deco){width:26px;height:26px;flex:none}.btn.full{width:100%}.btn.soft{background:var(--sf);color:var(--ink)}.btn.danger{background:#33201f;color:#ff9b8f}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:13px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.tile{border-radius:24px;padding:16px;color:var(--ink);border:1px solid var(--line);text-align:left;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{font-family:'DM Serif Display',serif;font-size:21px;font-weight:400;line-height:1.15}
.tile small{font-size:14px;color:var(--mut);font-weight:700}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center}
.tile svg.deco{position:absolute;right:-14px;bottom:-14px;width:90px;height:90px;opacity:.4}
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.mood{flex:1;display:grid;place-items:center;padding:6px 0;border-radius:18px;transition:transform .2s,background .2s}
.mood svg{width:46px;height:46px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mood:hover svg{transform:scale(1.1)}
.mood.on{background:var(--sf)}.mood.on svg{transform:scale(1.2)}
.mood span{font-size:12px;color:var(--mut);font-weight:800;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--mut)}
.chip.on{background:var(--ac);color:#0b1210;border-color:var(--ac)}
.entry{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%}
.entry svg{width:40px;height:40px;flex:none}
.entry .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);font-weight:500;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:900;border-radius:99px;padding:3px 10px;background:var(--sf);color:var(--ac)}
.meta-l{font-size:13px;color:var(--mut);font-weight:700}
.week{display:flex;justify-content:space-between;gap:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;opacity:.95}
.week i{width:30px;height:30px;border-radius:50%;background:#ffffff0d;display:grid;place-items:center}
.week i svg{width:30px;height:30px}
.prog{height:10px;border-radius:99px;background:var(--sf);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2f8379,var(--ac));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.goal{width:100%;text-align:left;display:block}
.pct{font-family:'DM Serif Display',serif;font-size:28px;color:var(--ac)}
.fromto{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:14px 0}
.fromto>div{border-radius:18px;padding:12px;font-size:15px}
.fromto small{display:block;font-weight:900;font-size:12px;margin-bottom:4px}
.f1{background:#2a2422;color:#e3b89c}.f2{background:#1b2b2a;color:#8fdccf}
.fromto .arr{display:grid;place-items:center;color:var(--ac)}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-weight:700}
.ck{width:30px;height:30px;border-radius:10px;border:2px solid #3a4654;flex:none;color:#0b1210;display:grid;place-items:center;transition:all .25s}
.ck svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.7,.5,1)}
.done .ck{background:var(--ac);border-color:var(--ac)}.done .ck svg{opacity:1;transform:none}
.done .st{text-decoration:line-through;color:var(--mut)}
.mis{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;font-size:17px;transition:transform .2s}
.mis:active{transform:scale(.97)}
.mis .ck{width:38px;height:38px;border-radius:14px}
.mis.done{background:#17242a;border-color:#2b4a48}.mis.done .ck{background:var(--ac);border-color:var(--ac)}
.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}@keyframes pop{40%{transform:scale(1.06)}}
.stat{display:flex;gap:10px;margin-top:16px}
.stat div{background:#ffffff08;border:1px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:800;font-size:14px}
.stat b{font-family:'DM Serif Display',serif;font-size:24px;color:var(--gold);font-weight:400;display:block}
.q{font-family:'DM Serif Display',serif;font-size:clamp(26px,7vw,32px);line-height:1.15;margin:8px 0 0;font-weight:400}
.dots{display:flex;gap:6px;margin-top:16px}.dots i{height:6px;flex:1;border-radius:9px;background:#ffffff14;transition:background .3s}.dots i.on{background:var(--ac)}
nav.tabs{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));background:#161d26;border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 40px #0008;display:flex;padding:8px;z-index:10;margin-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:8px 0;border-radius:18px;transition:all .25s}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:#0b1210;background:var(--ac)}
.drawer-bg,.ov{position:fixed;inset:0;background:#000b;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-bg.on,.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,84vw);background:#141a22;border-right:1px solid var(--line);z-index:21;transform:translateX(-102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:22px 14px;overflow:auto;border-radius:0 30px 30px 0}
.drawer.on{transform:none}
.dl{display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:16px;text-align:left;font-size:16px}
.dl:hover{background:var(--sf)}
.dl i{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ac);flex:none;background:var(--sf)!important}
.dl i svg{width:20px;height:20px}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:94vh;overflow:auto;background:#141a22;border-top:1px solid var(--line);border-radius:30px 30px 0 0;z-index:22;transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:#2e3946;margin:4px auto 14px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px;font-weight:800}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:100px;z-index:9;height:58px;padding:0 22px;border-radius:20px;color:#fff;box-shadow:0 12px 30px #0009;display:flex;align-items:center;gap:8px;font-size:16px;animation:up .4s .2s both}
.fab svg{width:20px;height:20px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty svg{width:90px;height:90px;margin-bottom:6px}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);text-align:center;transition:opacity .6s,visibility .6s;overflow:hidden}
#splash.out{opacity:0;visibility:hidden}
#splash .star{width:110px;height:110px;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both,glow 2.4s 1.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.5) rotate(-40deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 22px #d4a24c88)}}
#splash h1{font-size:56px;margin-top:18px;animation:up .8s .5s both}
#splash p{animation:up .8s .8s both;opacity:.9;font-weight:700}
#splash .ring{position:absolute;border:1px solid #4fb3a540;border-radius:50%;animation:ring 3s ease-out infinite}
@keyframes ring{from{width:80px;height:80px;opacity:1}to{width:700px;height:700px;opacity:0}}
#lock{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);padding:24px;text-align:center}
#lock.on{display:flex}
.pin{display:flex;gap:14px;margin:22px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac);transition:all .2s}.pin i.f{background:var(--ac);transform:scale(1.15)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:70px;font-size:26px;background:#ffffff0d;border:1px solid var(--line);border-radius:24px;color:var(--ink)}
.pad button:active{background:#4fb3a544}
.breath{width:230px;height:230px;margin:26px auto;position:relative;display:grid;place-items:center}
.breath .b{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#4fb3a5 0%,#4fb3a566 40%,#4fb3a500 70%);transform:scale(.55);transition:transform 4s ease-in-out}
.breath span{position:relative;font-family:'DM Serif Display',serif;font-size:28px;color:var(--ink);font-weight:400}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140px);background:var(--ac);color:#0b1210;font-weight:800;padding:12px 20px;border-radius:18px;z-index:60;transition:transform .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 10px 30px #0003;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.burst{position:fixed;pointer-events:none;z-index:61;width:10px;height:10px;border-radius:3px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(320deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="splash" class="g-sun"><div class="ring"></div><div class="ring" style="animation-delay:1s"></div><svg class="star" viewBox="0 0 100 100"><path d="M50 4l9 37 37 9-37 9-9 37-9-37-37-9 37-9z" fill="#d4a24c"/><path d="M50 4l9 37 37 9-37 9z" fill="#f0cf8a"/></svg><h1>Norte</h1><p>Seu espaço. Seu caminho.</p></div>
<div id="lock" class="g-ind"><svg width="60" height="60" viewBox="0 0 100 100"><path d="M50 4l9 37 37 9-37 9-9 37-9-37-37-9 37-9z" fill="#ffd27a"/></svg><h2 id="lockT" style="margin-top:14px">Bem-vindo de volta</h2><p id="lockS" style="opacity:.85;margin-top:6px">Digite seu PIN</p><div class="pin" id="pinDots"></div><div class="pad" id="pad"></div></div>

<div class="app"><main id="view"></main></div>
<div id="fabWrap"></div>
<nav class="tabs" id="tabs"></nav>
<div class="drawer-bg" id="dbg"></div><aside class="drawer" id="drawer"></aside>
<div class="ov" id="ov"></div><div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
{
const K='norte_v1';
const DEF={pin:null,cats:['Geral','Relacionamento','Vida espiritual','Família','Trabalho','Ansiedade'],entries:[],goals:[],answers:{},missions:{},custom:[],points:0};
let S;try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=structuredClone(DEF)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=k=>{const [y,m,d]=k.split('-');return d+'/'+m};
const fmtL=k=>{const d=new Date(k+'T12:00');return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const seed=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}};
const pick=(arr,n,key)=>{const r=seed(key),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};
let tt;const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)};
const burst=(el)=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#4fb3a5','#d4a24c','#e8edf2','#5b7fa6','#4fb3a5'];for(let i=0;i<16;i++){const p=document.createElement('i');p.className='burst';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=cols[i%5];const a=Math.random()*6.28,d=50+Math.random()*70;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),950)}};

const MOODC=['#5b7fa6','#7d8794','#4fb3a5','#d4a24c','#d9784a'],MOODN=['Mal','Ok','Bem','Feliz','Ótimo'];
const MOUTH=['M34 70q16-14 32 0','M34 66h32','M34 62q16 10 32 0','M32 60q18 18 36 0','M30 58q20 26 40 0z'];
const face=(i)=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${MOODC[i]}"/><ellipse cx="36" cy="42" rx="5" ry="${i===0?4:6}" fill="#10161d"/><ellipse cx="64" cy="42" rx="5" ry="${i===0?4:6}" fill="#10161d"/>${i===0?'<path d="M28 32l14 4M72 32l-14 4" stroke="#10161d" stroke-width="4" stroke-linecap="round"/>':''}<path d="${MOUTH[i]}" stroke="#10161d" stroke-width="5" stroke-linecap="round" fill="${i===4?'#10161d':'none'}"/>${i>=3?'<circle cx="26" cy="58" r="6" fill="#fff" opacity=".35"/><circle cx="74" cy="58" r="6" fill="#fff" opacity=".35"/>':''}</svg>`;

const GCATS=['Emoções','Autocuidado','Relacionamentos','Propósito','Fé','Hábitos saudáveis'];
const QUOTES=['Um passo pequeno ainda é um passo pra frente.','Você não precisa ter tudo resolvido hoje.','Seja gentil com quem você está se tornando.','Descansar também faz parte do caminho.','Sentir não é fraqueza. É ser humano.','O que você planta hoje, colhe amanhã.','Não compare seu começo com o meio de alguém.','Respira. Você já venceu dias difíceis antes.','Progresso, não perfeição.','Sua paz vale mais do que qualquer pressa.','Você é mais forte do que o dia de hoje.','Tudo bem ir devagar. Só não pare.'];
const QS=['Como você se sentiu hoje, de verdade?','O que pesou no seu coração hoje?','Pelo que você é grato hoje?','Você foi gentil consigo mesmo hoje?','Qual foi o melhor momento do seu dia?','O que te deixou ansioso hoje?','O que você aprendeu sobre você hoje?','Teve algo que você precisava falar e não falou?','O que você faria diferente se pudesse repetir o dia?','Quem fez seu dia melhor hoje?','Você cuidou do seu corpo hoje? Como?','O que te deixou orgulhoso hoje?','Que pensamento ficou se repetindo na sua cabeça?','Você deu um passo em direção a uma meta hoje?','O que você precisa soltar antes de dormir?','Em que momento você se sentiu em paz hoje?','O que você quer agradecer a Deus hoje?','Você se cobrou demais em algo hoje?','O que te deu energia hoje? E o que tirou?','Você riu hoje? Do quê?','Qual emoção mais apareceu no seu dia?','Você descansou o suficiente hoje?','Que pequena vitória merece ser lembrada?','O que está tirando sua paz ultimamente?','Você foi presente com quem ama hoje?','O que você precisa ouvir agora?','Qual medo apareceu hoje e o que ele queria te dizer?','O que você espera de amanhã?'];
const MS=['Beber pelo menos 2 litros de água','Ficar 10 minutos sem celular','Caminhar 15 minutos ao ar livre','Mandar mensagem pra alguém que você ama','Anotar 3 coisas pelas quais você é grato','Dormir mais cedo hoje','Fazer 3 minutos de respiração','Elogiar alguém de verdade','Ler 10 páginas de um livro','Orar ou meditar por 5 minutos','Ouvir uma música que te faz bem','Comer uma fruta','Arrumar um cantinho da casa','Tomar sol por 10 minutos','Dizer "não" pra algo que te sobrecarrega','Fazer alongamento por 5 minutos','Agradecer alguém pessoalmente','Ficar 1 hora sem redes sociais','Escrever um desabafo no app','Fazer algo só por diversão','Abraçar alguém','Tomar um banho com calma','Desligar notificações por 1 hora','Perdoar um erro seu de hoje','Ajudar alguém sem esperar nada','Olhar o céu por 2 minutos','Comer sem celular na mão','Falar algo bom de você no espelho'];

const I={menu:'<path d="M4 7h16M4 12h11M4 17h16"/>',home:'<path d="M4 11l8-7 8 7v9h-5v-5h-6v5H4z"/>',book:'<path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v14.5"/>',target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',spark:'<path d="M12 3l2 6.5L20.5 12 14 14l-2 7-2-7-6.5-2L10 9.5z"/>',wind:'<path d="M3 9h11a3 3 0 10-3-3M3 15h15a3 3 0 11-3 3M3 12h7"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M15 5l-7 7 7 7"/>',pen:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>',swap:'<path d="M4 8h13l-3-3M20 16H7l3 3"/>'};
const ic=(n,sw=2.2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const SCR={inicio:['Início','home','g-sun'],desabafos:['Desabafos','book','g-lav'],metas:['Metas','target','g-tea'],noite:['Perguntas da noite','moon','g-ind'],missoes:['Missões do bem','spark','g-amb']};
let scr=(location.hash||'').slice(1);if(!SCR[scr])scr='inicio';
let fCat='Todas',qi=0,qdraft=null;

const todayM=()=>{const k=dk();if(!S.missions[k]){S.missions[k]={list:pick(MS.concat(S.custom),3,k+'m'),done:[]};save()}return S.missions[k]};
const todayQ=()=>pick(QS,3,dk()+'q');
const gp=g=>g.steps.length?Math.round(g.steps.filter(s=>s.d).length/g.steps.length*100):(g.pct||0);
const streak=()=>{let n=0;const d=new Date();const ok=k=>(S.missions[k]&&S.missions[k].done.length)||S.entries.some(e=>e.date===k)||S.answers[k];if(!ok(dk(d)))d.setDate(d.getDate()-1);while(ok(dk(d))){n++;d.setDate(d.getDate()-1)}return n};
const cover=(g,kicker,title,sub,extra='')=>`<header class="cover ${g}"><i class="shape s1"></i><i class="shape s2"></i><i class="shape s3"></i><div class="bar"><button class="ib" id="menuBtn" aria-label="Abrir menu">${ic('menu',2.4)}</button><span class="kicker">${kicker}</span><span style="width:46px"></span></div><h1 class="in">${title}</h1>${sub?`<p class="sub in" style="animation-delay:.08s">${sub}</p>`:''}${extra}</header>`;
const d=i=>`style="animation-delay:${i*.07}s"`;

function vInicio(){
  const h=new Date().getHours(),greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',m=todayM(),ans=S.answers[dk()],q=pick(QUOTES,1,dk()+'f')[0];
  const ring=`<svg class="deco" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#4fb3a5" stroke-width="5" stroke-dasharray="${m.done.length/3*100.5} 100.5" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg>`;
  const top=S.goals[0];
  return cover('g-sun',fmtL(dk()),`${greet}, Kaique`,'“'+esc(q)+'”',`<div class="stat in" style="animation-delay:.15s"><div><b>${streak()}</b>dias seguidos</div><div><b>${S.points}</b>pontos</div></div>`)+
  `<div class="body"><div class="card in" ${d(1)}><h3>Como você está agora?</h3><div class="moods">${MOODN.map((n,i)=>`<button class="mood" data-qm="${i}" aria-label="${n}">${face(i)}<span>${n}</span></button>`).join('')}</div></div>
  <div class="tiles"><button class="tile g-amb in" ${d(2)} data-go="missoes">${ring}<small>${m.done.length} de 3 feitas</small><b>Missões do bem</b></button>
  <button class="tile g-ind in" ${d(3)} data-go="noite"><svg class="deco" viewBox="0 0 24 24" fill="#4fb3a5">${I.moon}</svg><small>${ans?'Respondidas ✓':'3 perguntas'}</small><b>Perguntas da noite</b></button>
  <button class="tile g-sky wide in" ${d(4)} id="tBreath"><svg class="deco" viewBox="0 0 24 24" fill="none" stroke="#4fb3a5" stroke-width="2">${I.wind}</svg><div class="grow"><b>Respira</b><br><small>1 minuto pra acalmar a mente</small></div>${ic('arrow')}</button>
  ${top?`<button class="tile wide in" ${d(5)} data-go="metas" style="background:var(--card)"><div class="grow"><small style="color:var(--mut)">Sua meta principal</small><br><b>${esc(top.title)}</b><div class="prog" style="margin-top:10px"><i style="width:${gp(top)}%"></i></div></div><span class="pct">${gp(top)}%</span></button>`:''}</div></div>`;
}

function vDesabafos(){
  const list=S.entries.filter(e=>fCat==='Todas'||e.cat===fCat);
  const week=Array.from({length:7},(_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);const k=dk(x),es=S.entries.filter(e=>e.date===k);return`<div><i>${es.length?face(Math.round(es.reduce((a,e)=>a+e.mood,0)/es.length)):''}</i>${'DSTQQSS'[x.getDay()]}</div>`}).join('');
  return cover('g-lav','Desabafos','Coloca pra fora','Aqui ninguém julga. É só você e o papel.',`<div class="card in" style="background:#ffffff08;margin:18px 0 0;padding:12px;animation-delay:.12s"><p style="font-size:13px;font-weight:800;margin-bottom:8px;opacity:.95">Seu humor na semana</p><div class="week">${week}</div></div>`)+
  `<div class="body" style="margin-top:-30px"><div class="chips in" ${d(1)}>${['Todas',...S.cats].map(c=>`<button class="chip ${fCat===c?'on':''}" data-fc="${esc(c)}">${esc(c)}</button>`).join('')}<button class="chip" id="mCats">${'+ Categoria'}</button></div>
  ${list.length?list.map((e,i)=>`<div class="card in" ${d(Math.min(i+2,8))}><button class="entry" data-open="${e.id}">${face(e.mood)}<div class="grow"><div class="row" style="gap:8px"><span class="tag">${esc(e.cat)}</span><span class="meta-l">${fmt(e.date)} · ${esc(e.time)}</span></div><p class="tx">${esc(e.text)}</p></div></button></div>`).join(''):`<div class="card empty in" ${d(2)}>${face(2)}<p><b>Nenhum desabafo ${fCat!=='Todas'?'nessa categoria':'ainda'}.</b><br>Toque em “Escrever” quando sentir vontade.</p></div>`}</div>`;
}

function vMetas(){
  return cover('g-tea','Metas e objetivos','Onde estou → onde quero chegar','Cresça no seu ritmo. Toque numa meta pra ver os passos.')+
  `<div class="body">${S.goals.length?S.goals.map((g,i)=>`<div class="card in" ${d(i+1)}><button class="goal" data-goal="${g.id}"><div class="row"><span class="tag" style="background:var(--sf);color:var(--ac)">${esc(g.cat)}</span><span class="grow"></span><span class="pct">${gp(g)}%</span></div><h3 style="margin:8px 0 12px">${esc(g.title)}</h3><div class="prog"><i style="width:${gp(g)}%"></i></div>${g.due?`<p class="meta-l" style="margin-top:10px">Prazo: ${fmt(g.due)}</p>`:''}</button></div>`).join(''):`<div class="card empty in" ${d(1)}><svg viewBox="0 0 24 24" fill="none" stroke="#4fb3a5" stroke-width="1.6">${I.target}</svg><p><b>Nenhuma meta ainda.</b><br>Exemplo: “Hoje me cobro demais” → “Quero ser mais gentil comigo”.</p></div>`}</div>`;
}

function vNoite(){
  const qs=todayQ(),a=S.answers[dk()];
  if(a&&!qdraft)return cover('g-ind','Perguntas da noite','Dia respondido 🌙','Obrigado por olhar pra dentro hoje.')+`<div class="body">${qs.map((q,i)=>`<div class="card in" ${d(i+1)}><p class="meta-l">${esc(q)}</p><p style="white-space:pre-wrap;margin-top:6px;font-weight:600">${esc(a.r[i]||'—')}</p></div>`).join('')}<div class="row in" ${d(4)}><button class="btn soft grow" id="qEdit">${ic('pen')}Editar</button><button class="btn grow" id="qHist">Dias anteriores</button></div></div>`;
  if(!qdraft)qdraft=a?a.r.slice():['','',''];
  return cover('g-ind',`Pergunta ${qi+1} de 3`,'',null,`<p class="q in">${esc(qs[qi])}</p><div class="dots">${[0,1,2].map(i=>`<i class="${i<=qi?'on':''}"></i>`).join('')}</div>`)+
  `<div class="body"><div class="card in" ${d(1)}><textarea id="qa" placeholder="Escreva com calma...">${esc(qdraft[qi])}</textarea><div class="row" style="margin-top:12px">${qi>0?`<button class="btn soft" id="qPrev" aria-label="Anterior">${ic('back')}</button>`:''}<button class="btn grow g-ind" id="qNext">${qi<2?'Próxima':'Salvar respostas'} ${ic(qi<2?'arrow':'check')}</button></div></div><button class="btn soft full in" ${d(2)} id="qHist">Ver dias anteriores</button></div>`;
}

function vMissoes(){
  const m=todayM();
  return cover('g-amb','Missões do bem','Cuide de você hoje','Cada missão vale 10 pontos.',`<div class="stat in" style="animation-delay:.12s"><div><b>${m.done.length}/3</b>hoje</div><div><b>${streak()}</b>dias seguidos</div><div><b>${S.points}</b>pontos</div></div>`)+
  `<div class="body">${m.list.map((t,i)=>`<button class="mis in ${m.done.includes(i)?'done':''}" ${d(i+1)} data-mis="${i}"><span class="ck">${ic('check',3)}</span><span class="st grow">${esc(t)}</span></button>`).join('')}
  <div class="row in" ${d(4)}><button class="btn soft grow" id="reroll">${ic('swap')}Trocar</button><button class="btn grow" id="myMis">Minhas missões</button></div></div>`;
}

function render(){
  $('view').innerHTML={inicio:vInicio,desabafos:vDesabafos,metas:vMetas,noite:vNoite,missoes:vMissoes}[scr]();
  $('tabs').innerHTML=[['inicio','Início','home'],['desabafos','Desabafos','book'],['metas','Metas','target']].map(t=>`<button class="${scr===t[0]?'on':''}" data-go="${t[0]}">${ic(t[2])}${t[1]}</button>`).join('');
  const fab={desabafos:['Escrever','pen','g-lav','write'],metas:['Nova meta','plus','g-tea','goal']}[scr];
  $('fabWrap').innerHTML=fab?`<button class="fab ${fab[2]}" id="fab" data-fab="${fab[3]}">${ic(fab[1],2.6)}${fab[0]}</button>`:'';
  document.querySelector('meta[name=theme-color]').content='#0e1217';
  bind();
}
function go(t){if(t!=='noite'){qdraft=null;qi=0}scr=t;try{history.replaceState(null,'','#'+t)}catch(e){}closeDrawer();closeSheet();render();scrollTo({top:0})}

function openDrawer(){$('drawer').innerHTML=`<div class="row" style="padding:4px 8px 18px"><svg width="34" height="34" viewBox="0 0 100 100"><path d="M50 4l9 37 37 9-37 9-9 37-9-37-37-9 37-9z" fill="#d4a24c"/></svg><h2 class="grow">Norte</h2><button class="ib" style="background:var(--sf)" id="dClose" aria-label="Fechar">${ic('x')}</button></div>
  ${[['inicio','Início','home','g-sun'],['desabafos','Desabafos','book','g-lav'],['metas','Metas e objetivos','target','g-tea'],['noite','Perguntas da noite','moon','g-ind'],['missoes','Missões do bem','spark','g-amb']].map(x=>`<button class="dl" data-go="${x[0]}"><i class="${x[3]}">${ic(x[2])}</i>${x[1]}</button>`).join('')}
  <div style="height:1px;background:var(--line);margin:10px 8px"></div>
  <button class="dl" id="dBreath"><i class="g-sky">${ic('wind')}</i>Respira</button>
  <button class="dl" id="dCats"><i style="">${ic('tag')}</i>Categorias de desabafo</button>
  <button class="dl" id="dCfg"><i style="">${ic('lock')}</i>PIN e backup</button>`;
  $('drawer').classList.add('on');$('dbg').classList.add('on');
  $('dClose').onclick=closeDrawer;$('drawer').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $('dBreath').onclick=()=>{closeDrawer();breathSheet()};$('dCats').onclick=()=>{closeDrawer();catSheet()};$('dCfg').onclick=()=>{closeDrawer();cfgSheet()};}
function closeDrawer(){$('drawer').classList.remove('on');$('dbg').classList.remove('on')}
$('dbg').onclick=closeDrawer;

function openSheet(html,bg){const s=$('sheet');s.style.background=bg||'#141a22';s.innerHTML='<div class="grab"></div>'+html;s.scrollTop=0;s.classList.add('on');$('ov').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on');$('ov').classList.remove('on');stopBreath()}
$('ov').onclick=closeSheet;
function ask(msg,yes){openSheet(`<h2>${esc(msg)}</h2><p class="mut" style="margin-top:8px">Isso não pode ser desfeito.</p><div class="row" style="margin-top:18px"><button class="btn soft grow" id="no">Cancelar</button><button class="btn danger grow" id="yes">Excluir</button></div>`);$('yes').onclick=()=>{closeSheet();yes()};$('no').onclick=closeSheet}

function writeSheet(mood=null,edit=null){
  let st={mood:edit?edit.mood:(mood??2),cat:edit?edit.cat:(fCat!=='Todas'?fCat:'Geral')};
  const draw=()=>{const txt=$('wt')?$('wt').value:(edit?edit.text:'');
  openSheet(`<div class="row"><h2 class="grow">${edit?'Editar desabafo':'Como você está?'}</h2><button class="ib" style="background:var(--sf)" id="wx" aria-label="Fechar">${ic('x')}</button></div>
  <div class="moods">${MOODN.map((n,i)=>`<button class="mood ${st.mood===i?'on':''}" data-wm="${i}">${face(i)}<span>${n}</span></button>`).join('')}</div>
  <label>Sobre o quê?</label><div class="chips">${S.cats.map(c=>`<button class="chip ${st.cat===c?'on':''}" data-wc="${esc(c)}">${esc(c)}</button>`).join('')}<button class="chip" id="wnc">+ Nova</button></div>
  <label for="wt">Escreva sem filtro</label><textarea id="wt" style="min-height:200px" placeholder="O que está no seu coração?">${esc(txt)}</textarea>
  <button class="btn full g-lav" id="ws" style="margin-top:14px">${ic('check')}Guardar desabafo</button>`);
  $('wx').onclick=closeSheet;
  $('sheet').querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>{st.mood=+b.dataset.wm;draw()});
  $('sheet').querySelectorAll('[data-wc]').forEach(b=>b.onclick=()=>{st.cat=b.dataset.wc;draw()});
  $('wnc').onclick=()=>{const t=$('wt').value;catSheet(()=>{writeSheet(st.mood,edit?Object.assign({},edit,{text:t,mood:st.mood}):{id:null,text:t,mood:st.mood,cat:st.cat,_new:true})})};
  $('ws').onclick=()=>{const t=$('wt').value.trim();if(!t){toast('Escreva algo primeiro');return}
    if(edit&&!edit._new){Object.assign(S.entries.find(e=>e.id===edit.id),{text:t,mood:st.mood,cat:st.cat})}else{const n=new Date();S.entries.unshift({id:uid(),date:dk(n),time:n.toTimeString().slice(0,5),mood:st.mood,cat:st.cat,text:t})}
    save();closeSheet();if(scr!=='desabafos')go('desabafos');else render();toast('Desabafo guardado 💜')};};
  draw();
}
function readSheet(id){const e=S.entries.find(x=>x.id===id);if(!e)return;
  openSheet(`<div class="row"><span style="width:54px">${face(e.mood)}</span><div class="grow"><span class="tag">${esc(e.cat)}</span><p class="meta-l" style="margin-top:4px">${fmtL(e.date)} · ${esc(e.time)}</p></div></div><p style="white-space:pre-wrap;font-size:17px;margin:18px 0 22px">${esc(e.text)}</p><div class="row"><button class="btn danger" id="rd">Excluir</button><button class="btn soft grow" id="re">${ic('pen')}Editar</button></div>`);
  $('rd').onclick=()=>ask('Excluir este desabafo?',()=>{S.entries=S.entries.filter(x=>x.id!==id);save();render()});
  $('re').onclick=()=>writeSheet(null,e);}

function catSheet(after){
  const back=()=>after?after():closeSheet();
  openSheet(`<div class="row"><h2 class="grow">Categorias</h2><button class="ib" style="background:var(--sf)" id="cx" aria-label="Fechar">${ic('x')}</button></div><p class="mut" style="margin-top:6px">Ao excluir uma categoria, os desabafos dela vão pra “Geral”.</p>
  <div class="row" style="margin-top:14px"><input id="nc" class="grow" placeholder="Ex.: Desabafo sobre amizades" style="flex:1 1 180px"><button class="btn g-lav" id="ca">${ic('plus')}Criar</button></div>
  <div style="margin-top:12px">${S.cats.map((c,i)=>`<div class="step" style="justify-content:space-between"><span class="row" style="gap:10px"><span class="tag">${esc(c)}</span><span class="meta-l">${S.entries.filter(e=>e.cat===c).length} desabafo(s)</span></span>${c==='Geral'?'<span class="meta-l">padrão</span>':`<button class="btn danger sm" data-dc="${i}">Excluir</button>`}</div>`).join('')}</div>`);
  $('cx').onclick=back;
  $('ca').onclick=()=>{const v=$('nc').value.trim();if(!v)return;if(S.cats.includes(v)){toast('Essa já existe');return}S.cats.push(v);save();toast('Categoria criada');after?after():(render(),catSheet())};
  $('sheet').querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{const c=S.cats[+b.dataset.dc];ask(`Excluir “${c}”?`,()=>{S.cats=S.cats.filter(x=>x!==c);S.entries.forEach(e=>{if(e.cat===c)e.cat='Geral'});if(fCat===c)fCat='Todas';save();render();catSheet(after)})});
}

function goalSheet(id){const g=S.goals.find(x=>x.id===id);if(!g)return;const p=gp(g);
  openSheet(`<div class="row"><span class="tag" style="background:var(--sf);color:var(--ac)">${esc(g.cat)}</span><span class="grow"></span><button class="ib" style="background:var(--sf)" id="gx" aria-label="Fechar">${ic('x')}</button></div><h2 style="margin-top:10px">${esc(g.title)}</h2>
  <div class="fromto"><div class="f1"><small>ONDE ESTOU HOJE</small>${esc(g.now)||'—'}</div><div class="arr">${ic('arrow')}</div><div class="f2"><small>ONDE QUERO ESTAR</small>${esc(g.want)||'—'}</div></div>
  <div class="row"><div class="prog grow"><i style="width:${p}%"></i></div><span class="pct">${p}%</span></div>
  ${g.steps.length?`<label>Próximos passos</label>`+g.steps.map((s,i)=>`<button class="step ${s.d?'done':''}" data-st="${i}"><span class="ck">${ic('check',3)}</span><span class="st">${esc(s.t)}</span></button>`).join(''):''}
  <p class="meta-l" style="margin:14px 0">${g.due?'Prazo: '+fmt(g.due)+' · ':''}Atualizada em ${fmt(dk(new Date(g.upd)))}</p>
  <div class="row"><button class="btn danger" id="gd">Excluir</button><button class="btn grow g-tea" id="ge">${ic('pen')}Atualizar meta</button></div>`);
  $('gx').onclick=closeSheet;
  $('sheet').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const s=g.steps[+b.dataset.st];s.d=!s.d;if(s.d){S.points+=5;burst(b);toast('Passo concluído · +5')}save();render();goalSheet(id)});
  $('gd').onclick=()=>ask('Excluir esta meta?',()=>{S.goals=S.goals.filter(x=>x.id!==id);save();render()});
  $('ge').onclick=()=>goalForm(g);}

function goalForm(g){
  g=g||{id:null,cat:GCATS[0],title:'',now:'',want:'',due:'',steps:[],pct:0};
  openSheet(`<div class="row"><h2 class="grow">${g.id?'Atualizar meta':'Nova meta'}</h2><button class="ib" style="background:var(--sf)" id="fx" aria-label="Fechar">${ic('x')}</button></div>
  <label for="gt">Qual é a meta?</label><input id="gt" value="${esc(g.title)}" placeholder="Ex.: Ter mais paz na mente">
  <label>Área</label><div class="chips">${GCATS.map(c=>`<button class="chip ${g.cat===c?'on':''}" data-gc="${c}">${c}</button>`).join('')}</div>
  <label for="gn">Onde estou hoje</label><textarea id="gn" style="min-height:80px" placeholder="Seja sincero com você">${esc(g.now)}</textarea>
  <label for="gw">Onde quero estar</label><textarea id="gw" style="min-height:80px">${esc(g.want)}</textarea>
  <label for="gs">Próximos passos (um por linha)</label><textarea id="gs" style="min-height:100px" placeholder="Ex.: Fazer 5 min de respiração por dia">${esc(g.steps.map(s=>s.t).join('\n'))}</textarea>
  <label for="gd2">Prazo (opcional)</label><input id="gd2" type="date" value="${esc(g.due)}">
  <label for="gp">Progresso manual (se não usar passos): <b id="gpv">${g.pct||0}%</b></label><input id="gp" type="range" min="0" max="100" step="5" value="${g.pct||0}" style="padding:0;accent-color:#4fb3a5">
  <button class="btn full g-tea" id="gsv" style="margin-top:18px">${ic('check')}Salvar meta</button>`);
  let cat=g.cat;
  $('fx').onclick=closeSheet;
  $('sheet').querySelectorAll('[data-gc]').forEach(b=>b.onclick=()=>{cat=b.dataset.gc;$('sheet').querySelectorAll('[data-gc]').forEach(x=>x.classList.toggle('on',x===b))});
  $('gp').oninput=e=>$('gpv').textContent=e.target.value+'%';
  $('gsv').onclick=()=>{const title=$('gt').value.trim();if(!title){toast('Dê um nome pra meta');return}
    const steps=$('gs').value.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t,d:!!g.steps.find(o=>o.t===t&&o.d)}));
    const n={id:g.id||uid(),cat,title,now:$('gn').value.trim(),want:$('gw').value.trim(),due:$('gd2').value,steps,pct:+$('gp').value,upd:Date.now()};
    const i=S.goals.findIndex(x=>x.id===n.id);i>=0?S.goals[i]=n:S.goals.unshift(n);save();closeSheet();render();toast('Meta salva ✨')};
}

function histSheet(){const ks=Object.keys(S.answers).sort().reverse();
  openSheet(`<div class="row"><h2 class="grow">Noites anteriores</h2><button class="ib" style="background:var(--sf)" id="hx" aria-label="Fechar">${ic('x')}</button></div>${ks.length?ks.map(k=>`<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-weight:800;text-transform:capitalize">${fmtL(k)}</summary>${S.answers[k].q.map((q,i)=>`<p class="meta-l" style="margin-top:12px;color:var(--ac)">${esc(q)}</p><p style="white-space:pre-wrap">${esc(S.answers[k].r[i]||'—')}</p>`).join('')}</details>`).join(''):'<p class="empty">Suas respostas vão aparecer aqui.</p>'}`);$('hx').onclick=closeSheet}

function myMisSheet(){openSheet(`<div class="row"><h2 class="grow">Minhas missões</h2><button class="ib" style="background:var(--sf)" id="mx" aria-label="Fechar">${ic('x')}</button></div><p class="mut" style="margin-top:6px">Elas entram no sorteio dos próximos dias.</p>
  <div class="row" style="margin-top:14px"><input id="nm" class="grow" placeholder="Ex.: Ligar pra minha mãe" style="flex:1 1 180px"><button class="btn g-amb" id="ma">${ic('plus')}Criar</button></div>
  ${S.custom.length?S.custom.map((c,i)=>`<div class="step" style="justify-content:space-between"><span>${esc(c)}</span><button class="btn danger sm" data-dm="${i}">Excluir</button></div>`).join(''):'<p class="empty">Nenhuma missão sua ainda.</p>'}`);
  $('mx').onclick=closeSheet;$('ma').onclick=()=>{const t=$('nm').value.trim();if(!t)return;S.custom.push(t);save();myMisSheet();toast('Missão criada')};
  $('sheet').querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{S.custom.splice(+b.dataset.dm,1);save();myMisSheet()});}

let bt=null;const stopBreath=()=>{clearTimeout(bt);bt=null};
function breathSheet(){
  openSheet(`<div style="text-align:center"><h2>Respira</h2><p style="opacity:.9;margin-top:6px">Inspire 4s · segure 4s · solte 6s</p></div><div class="breath"><div class="b" id="bc"></div><span id="bl">Pronto?</span></div><p style="text-align:center;color:var(--mut);font-weight:700;min-height:24px" id="bn"></p><div class="row" style="margin-top:10px"><button class="btn grow" style="background:var(--ac);color:#0b1210" id="bgo">Começar</button><button class="btn grow" style="background:var(--sf);color:var(--ink)" id="bx">Fechar</button></div>`,'#141a22');
  $('bx').onclick=closeSheet;
  $('bgo').onclick=()=>{stopBreath();$('bgo').textContent='Recomeçar';let c=0;const bc=$('bc'),bl=$('bl'),bn=$('bn');
    const cyc=()=>{if(!$('bc'))return;if(c>=6){bl.textContent='Muito bem';bc.style.transform='scale(.8)';bn.textContent='Você cuidou de você agora. 💙';S.points+=5;save();return}
      c++;bn.textContent='Ciclo '+c+' de 6';bl.textContent='Inspire';bc.style.transition='transform 4s ease-in-out';bc.style.transform='scale(1)';
      bt=setTimeout(()=>{bl.textContent='Segure';bt=setTimeout(()=>{bl.textContent='Solte';bc.style.transition='transform 6s ease-in-out';bc.style.transform='scale(.55)';bt=setTimeout(cyc,6000)},4000)},4000)};cyc()};
}

function cfgSheet(){
  const standalone=window.top===window;
  openSheet(`<div class="row"><h2 class="grow">PIN e backup</h2><button class="ib" style="background:var(--sf)" id="sx" aria-label="Fechar">${ic('x')}</button></div>
  <div class="card" style="margin-top:14px;background:var(--sf)"><h3>PIN de acesso</h3><p class="mut" style="margin:4px 0 12px">${S.pin?'Seu app está protegido.':'Sem PIN: qualquer um com seu celular pode abrir.'}</p><div class="row"><button class="btn g-ind" id="sp">${S.pin?'Trocar PIN':'Criar PIN'}</button>${S.pin?'<button class="btn danger" id="sr">Remover</button>':''}</div></div>
  <div class="card" style="background:var(--sf)"><h3>Backup</h3><p class="mut" style="margin:4px 0 12px">Seus dados ficam só neste aparelho. Faça backup antes de trocar de celular ou limpar o navegador.</p>
  <div class="row">${standalone?'<button class="btn" id="se">Baixar backup</button>':''}<button class="btn soft" id="sc">Copiar backup</button></div>
  <label for="si">Restaurar de arquivo</label><input type="file" id="si" accept=".json,application/json">
  <label for="st">Ou cole o backup aqui</label><textarea id="st" style="min-height:70px"></textarea><button class="btn soft full" id="sb" style="margin-top:8px">Restaurar texto colado</button></div>`);
  $('sx').onclick=closeSheet;$('sp').onclick=()=>{closeSheet();lock('new')};
  if($('sr'))$('sr').onclick=()=>{S.pin=null;save();cfgSheet();toast('PIN removido')};
  const data=()=>JSON.stringify(S);
  if($('se'))$('se').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data()],{type:'application/json'}));a.download='norte-backup-'+dk()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup baixado')};
  $('sc').onclick=()=>{navigator.clipboard.writeText(data()).then(()=>toast('Backup copiado'),()=>{$('st').value=data();toast('Copie o texto abaixo')})};
  const restore=t=>{try{const o=JSON.parse(t);if(!o.cats||!o.entries)throw 0;S=Object.assign(structuredClone(DEF),o);save();closeSheet();render();toast('Backup restaurado ✅')}catch(e){toast('Backup inválido')}};
  $('si').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)};
  $('sb').onclick=()=>restore($('st').value);
}

let pb='',pm='open',pf='';
function lock(mode){pm=mode;pb='';pf='';$('lockT').textContent=mode==='open'?'Bem-vindo de volta':'Crie seu PIN';$('lockS').textContent=mode==='open'?'Digite seu PIN':'4 dígitos pra proteger seu espaço';$('lock').classList.add('on');dots()}
const dots=()=>$('pinDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pb.length?'f':''}"></i>`).join('');
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button data-k="${k}">${k}</button>`:'<span></span>').join('');
$('pad').addEventListener('click',e=>{const k=e.target.closest('[data-k]')?.dataset.k;if(!k)return;if(k==='⌫'){pb=pb.slice(0,-1);dots();return}if(pb.length>=4)return;pb+=k;dots();if(pb.length===4)setTimeout(pinDone,160)});
function pinDone(){const dd=$('pinDots');
  if(pm==='open'){if(pb===S.pin){$('lock').classList.remove('on')}else{$('lockS').textContent='PIN errado, tenta de novo';dd.classList.remove('shake');void dd.offsetWidth;dd.classList.add('shake');pb='';dots()}return}
  if(!pf){pf=pb;pb='';$('lockT').textContent='Confirme o PIN';dots();return}
  if(pb===pf){S.pin=pb;save();$('lock').classList.remove('on');toast('PIN criado 🔒')}else{pf='';pb='';$('lockT').textContent='Não bateu. Crie de novo';dd.classList.add('shake');dots()}}

function bind(){
  const v=$('view');
  $('menuBtn').onclick=openDrawer;
  document.querySelectorAll('#view [data-go],#tabs [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const fab=$('fab');if(fab)fab.onclick=()=>fab.dataset.fab==='write'?writeSheet():goalForm();
  if(scr==='inicio'){v.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>writeSheet(+b.dataset.qm));$('tBreath').onclick=breathSheet}
  if(scr==='desabafos'){v.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{fCat=b.dataset.fc;render()});$('mCats').onclick=()=>catSheet();v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>readSheet(b.dataset.open))}
  if(scr==='metas')v.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>goalSheet(b.dataset.goal));
  if(scr==='noite'){
    if($('qHist'))$('qHist').onclick=histSheet;
    if($('qEdit'))$('qEdit').onclick=()=>{qdraft=S.answers[dk()].r.slice();qi=0;render()};
    if($('qa')){$('qa').oninput=e=>qdraft[qi]=e.target.value;
      if($('qPrev'))$('qPrev').onclick=()=>{qi--;render()};
      $('qNext').onclick=()=>{if(qi<2){qi++;render();return}if(!qdraft.some(x=>x.trim())){toast('Responda pelo menos uma');return}const first=!S.answers[dk()];S.answers[dk()]={q:todayQ(),r:qdraft.map(x=>x.trim())};if(first)S.points+=15;save();qdraft=null;qi=0;render();burst($('view'));toast(first?'Respostas salvas · +15 🌙':'Respostas atualizadas')}}
  }
  if(scr==='missoes'){
    v.querySelectorAll('[data-mis]').forEach(b=>b.onclick=()=>{const m=todayM(),i=+b.dataset.mis,j=m.done.indexOf(i);if(j>=0){m.done.splice(j,1);S.points=Math.max(0,S.points-10);b.classList.remove('done')}else{m.done.push(i);S.points+=10;b.classList.add('done','pop');burst(b);toast(m.done.length===3?'Todas feitas! Orgulho de você 🌟':'+10 pontos')}save();setTimeout(render,550)});
    $('reroll').onclick=()=>{const m=todayM(),keep=m.list.filter((_,i)=>m.done.includes(i)),pool=MS.concat(S.custom).filter(x=>!m.list.includes(x));m.list=keep.concat(pick(pool,3-keep.length,dk()+Math.random()));m.done=keep.map((_,i)=>i);save();render()};
    $('myMis').onclick=myMisSheet;
  }
}

addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SCR[t]&&t!==scr)go(t)});
render();
setTimeout(()=>{$('splash').classList.add('out');if(S.pin)lock('open')},matchMedia('(prefers-reduced-motion:reduce)').matches?300:2000);
$('splash').onclick=()=>$('splash').classList.add('out');
}
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
