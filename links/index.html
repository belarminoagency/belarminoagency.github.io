<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaique Belarmino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* VOICE: pessoal, masculino, direto — sem personagem
   IDEA: capa de revista: foto cheia, nome grande por cima
   PICTURE: a foto do Kaique ocupando o topo, luz quente
   COLOUR and TYPE: branco + preto, acento dourado da luz da estante; Archivo Black + Instrument Serif itálico
   LAYOUT: coluna única de celular, foto > nome > botões */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#16130f);--ink:light-dark(#141414,#f4efe6);--soft:light-dark(#5c5c5c,#b9b0a2);--card:light-dark(#f3f1ed,#221d17);--gold:#e3a83b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;aspect-ratio:3/3.4;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.15) 62%,rgba(0,0,0,.78) 100%)}
.name{position:absolute;left:0;right:0;bottom:22px;z-index:1;text-align:center;color:#fff;padding:0 16px}
.name h1{margin:0;font:400 clamp(40px,12vw,56px)/1 "Archivo Black",sans-serif;letter-spacing:.01em;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.name h1 em{display:block;font:italic 400 clamp(38px,11vw,52px)/1 "Instrument Serif",serif;text-transform:none;letter-spacing:0;margin-top:2px}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:14px;font-weight:600;opacity:.92}
.tags span+span::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:14px;vertical-align:middle}
.links{padding:26px 18px 10px;display:grid;gap:12px}
.links a{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 18px;border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;transition:transform .15s ease,background .15s}
.links a:hover{transform:translateY(-2px)}
.links a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.links a.main{background:var(--ink);color:var(--bg)}
.links small{display:block;font-weight:400;font-size:13px;color:var(--soft)}
.links a.main small{color:inherit;opacity:.7}
.ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:#141414}
.ic svg{width:20px;height:20px}
.arrow{margin-left:auto;opacity:.5;font-size:18px}
.links .soon{opacity:.55;pointer-events:none}
.links .free{background:var(--gold);color:#141414;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;margin-left:auto;white-space:nowrap}
h2{margin:0 0 12px;font:400 22px/1.1 "Archivo Black",sans-serif;text-transform:uppercase}
h2 em{font:italic 400 24px "Instrument Serif",serif;text-transform:none}
.sec{padding:22px 18px 4px}
.cartel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cartel div{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center}
.cartel b{display:block;font:400 26px/1 "Archivo Black",sans-serif}
.cartel span{display:block;font-size:13px;color:var(--soft);margin-top:6px;line-height:1.3}
footer{margin-top:auto;padding:24px 18px 30px;text-align:center;font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){.links a{transition:none}.links a:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <img src="foto.jpg" alt="Kaique Belarmino">
    <div class="name">
      <h1>Kaique<em>Belarmino</em></h1>
      <div class="tags"><span>Atleta</span><span>Empresário</span><span>Cristão</span></div>
    </div>
  </header>
  <nav class="links" id="links"></nav>
  <section class="sec">
    <h2>Meu <em>cartel</em></h2>
    <div class="cartel">
      <div><b>9-1-2</b><span>Amador<br>12 lutas</span></div>
      <div><b>3-0</b><span>Muay Thai<br>profissional</span></div>
      <div><b>1-0</b><span>MMA<br>estreia</span></div>
    </div>
  </section>
  <section class="sec">
    <h2>Meus <em>apps</em></h2>
    <nav class="links" id="apps" style="padding:0"></nav>
  </section>
  <section class="sec">
    <h2>Me <em>acompanhe</em></h2>
    <nav class="links" id="redes" style="padding:0"></nav>
  </section>
  <footer>Petrópolis, RJ</footer>
</div>
<script>
{
const icons={
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  fit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>',
  fight:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10V6a2 2 0 0 1 4 0v3m0 0V5a2 2 0 0 1 4 0v4m0 0V7a2 2 0 0 1 4 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-6-6v-3a2 2 0 0 1 2-2h3"/></svg>',
  tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3c.3 2.2 1.7 3.8 4 4v3a7 7 0 0 1-4-1.3V15a6 6 0 1 1-6-6v3.2A2.8 2.8 0 1 0 12.8 15V3z"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 8.2a3 3 0 0 0-2-2.1C18.2 5.6 12 5.6 12 5.6s-6.2 0-8 .5a3 3 0 0 0-2 2.1A31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2 2.1c1.8.5 8 .5 8 .5s6.2 0 8-.5a3 3 0 0 0 2-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8zM10 15.1V8.9l5.2 3.1z"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>'
};
// Para editar os links, mude só estas listas (soon:true = "em breve"):
const links=[
  {t:'Fale comigo no WhatsApp',s:'(11) 95383-7208',u:'https://wa.me/5511953837208',i:'wa',main:true},
  {t:'belarmino agency',s:'Marketing digital · @belarminoagency',u:'https://instagram.com/belarminoagency',i:'ig'},
  {t:'Site da agência',s:'belarminoagency.github.io',u:'https://belarminoagency.github.io',i:'web'}
];
const apps=[
  {t:'Forja',s:'Treino e alimentação personalizados',u:'https://belarminoagency.github.io/forja/',i:'fit',free:true},
  {t:'B-Fight',s:'Boxe, Muay Thai, MMA e Jiu-Jitsu · iPhone e Android',u:'https://belarminoagency.github.io/b-fight/',i:'fight',free:true},
  {t:'B-Fight para Android',s:'Baixar o app (APK)',u:'https://belarminoagency.github.io/apps/b-fight.apk',i:'fight'}
];
const redes=[
  {t:'TikTok',s:'Em breve',u:'',i:'tt',soon:true},
  {t:'YouTube',s:'Em breve',u:'',i:'yt',soon:true}
];
const row=l=>`<a href="${l.u||'#'}" target="_blank" rel="noopener" class="${l.main?'main':''} ${l.soon&&!l.u?'soon':''}"><span class="ic">${icons[l.i]}</span><span>${l.t}<small>${l.s}</small></span>${l.free?'<span class="free">GRÁTIS</span>':'<span class="arrow">→</span>'}</a>`;
document.getElementById('links').innerHTML=links.map(row).join('');
document.getElementById('apps').innerHTML=apps.map(row).join('');
document.getElementById('redes').innerHTML=redes.map(row).join('');
}
</script>
</body>
</html>
