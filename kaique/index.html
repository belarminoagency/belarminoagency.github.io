<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organização do Kaique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#1E3A2F;--ouro:#E9B44C;--claro:#C9D8CC;--creme:#F7F3EA;--texto:#22302a;--sub:#6f7a72;--linha:#ebe5d8;--alta:#d1495b;--media:#E9B44C;--baixa:#4f9d69}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--creme);color:var(--texto);min-height:100vh}
button{font-family:inherit}
header{background:var(--verde);color:#fff;padding:28px 20px 70px}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{width:38px;height:38px;border-radius:50%;background:var(--ouro);color:var(--verde);display:grid;place-items:center;font-family:Inter;font-size:20px}
.logo span{font-size:14px;color:var(--claro)}
.topdir{display:flex;gap:8px;align-items:center}
.sync{font-size:12px;color:var(--claro);background:rgba(255,255,255,.08);padding:5px 10px;border-radius:999px}
.sair{border:0;background:rgba(255,255,255,.08);color:var(--claro);font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
.sair:hover{background:rgba(255,255,255,.16);color:#fff}
h1{font-family:Inter;font-weight:800;letter-spacing:-.5px;font-size:32px;margin-top:22px}
.data{color:var(--claro);font-size:14px;margin-top:4px;text-transform:capitalize}
.frase{margin-top:18px;position:relative;padding:4px 0 4px 34px;transition:opacity .6s}
.frase::before{content:"“";position:absolute;left:0;top:-8px;font-family:Georgia,serif;font-size:52px;color:var(--ouro);line-height:1}
.frase p{font-size:18px;line-height:1.5;font-weight:500}
.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;min-width:110px}
.stat strong{display:block;font-family:Inter;font-size:22px}
.stat small{font-size:12px;color:var(--claro)}
.barra{height:6px;background:rgba(255,255,255,.15);border-radius:9px;margin-top:16px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ouro);width:0;transition:width .4s}
main{margin-top:-46px;padding:0 20px 60px}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(30,58,47,.08)}
/* quadros */
.quadros{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.quadro{flex:none;border:0;background:#fff;border-radius:14px;padding:10px 14px;cursor:pointer;text-align:left;box-shadow:0 2px 8px rgba(30,58,47,.06);min-width:120px;position:relative}
.quadro strong{display:block;font-size:13px;font-weight:600;color:var(--texto);white-space:nowrap}
.quadro small{font-size:11px;color:var(--sub)}
.quadro.on{background:var(--ouro)}
.quadro.on small{color:var(--verde)}
.quadro.novo{background:transparent;box-shadow:none;border:1.5px dashed #cfc6b2;color:var(--sub);font-size:13px;min-width:auto}
.qmenu{display:none;position:absolute;top:6px;right:6px;gap:2px}
.quadro.on .qmenu{display:flex}
.qmenu span{font-size:12px;padding:1px 5px;border-radius:6px;color:var(--verde);opacity:.7}
.qmenu span:hover{opacity:1;background:rgba(0,0,0,.08)}
.quadro.on strong{padding-right:38px}
/* nova */
form.nova{padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px}
form.nova input[type=text]{border:1.5px solid var(--linha);border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;outline:none}
form.nova input[type=text]:focus{border-color:var(--verde)}
.btn{background:var(--ouro);color:var(--verde);border:0;border-radius:12px;padding:0 20px;font:600 15px Inter;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.opts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.opts select,.opts input{border:1.5px solid var(--linha);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;color:var(--texto);background:#fff}
.filtros{display:flex;gap:6px;margin:18px 0 12px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:#fff;color:var(--sub);padding:8px 14px;border-radius:999px;font:500 13px Inter;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chip.on{background:var(--verde);color:#fff}
.busca{margin-left:auto;border:1.5px solid var(--linha);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;background:#fff;min-width:170px}
.lista{list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--claro);background:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.feito .check{background:var(--verde);border-color:var(--verde)}
.feito .check::after{content:"";width:6px;height:11px;border:solid var(--ouro);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.corpo{flex:1;min-width:0}
.titulo{font-size:15px;font-weight:500;word-break:break-word;cursor:text}
.feito .titulo{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--creme);color:var(--sub);font-weight:500}
.tag.cat{background:#e6efe8;color:var(--verde)}
.tag.atrasada{background:#fbe6e8;color:var(--alta)}
.tag.hoje{background:#fbf0d6;color:#8a6210}
select.mover{font:500 11px Inter;color:var(--sub);background:var(--creme);border:0;border-radius:999px;padding:2px 6px;cursor:pointer;max-width:150px}
.prio{width:5px;align-self:stretch;border-radius:4px;flex:none}
.lista{overflow:hidden}
.item.pr-alta{background:#fdf0f1}
.item.pr-media{background:#fdf7e8}
.item.pr-baixa{background:#eef7f0}
.item.feito{background:#fff;opacity:.75}
.tag.tp-alta{background:#f8d3d7;color:#a32637}
.tag.tp-media{background:#f7e4b5;color:#7a5408}
.tag.tp-baixa{background:#cfe8d6;color:#2a6a3e}
.feito .tag.tp-alta,.feito .tag.tp-media,.feito .tag.tp-baixa{background:var(--creme);color:var(--sub)}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--sub);margin:0 0 10px 4px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.p-alta{background:var(--alta)}.p-media{background:var(--media)}.p-baixa{background:var(--baixa)}
.del{border:0;background:none;color:#c2bba9;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px;line-height:1}
.ed{border:0;background:none;color:#a9a290;font-size:16px;cursor:pointer;padding:4px 7px;border-radius:8px;line-height:1}
.ed:hover{color:var(--verde);background:rgba(30,58,47,.08)}
.campos label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px;font-weight:500}
.campos select{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:11px;font:inherit;font-size:14px;background:#fff}
.campos .dois{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .box{max-width:420px!important}
.del:hover{color:var(--alta);background:#fbe6e8}
.vazio{padding:46px 20px;text-align:center;color:var(--sub)}
.vazio div{font-size:34px;margin-bottom:8px}
.edit{width:100%;border:1.5px solid var(--verde);border-radius:8px;padding:6px 8px;font:inherit;font-size:15px}
.rodape{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--sub)}
.link{border:0;background:none;color:var(--verde);font:500 12px Inter;cursor:pointer;text-decoration:underline}
.aviso{font-size:12px;color:var(--sub);margin-top:10px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);background:var(--verde);color:#fff;padding:14px 20px;border-radius:14px;max-width:92%;width:440px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:15px;font-weight:500;transition:transform .5s;z-index:9;border-left:4px solid var(--ouro)}
.toast.on{transform:translateX(-50%) translateY(0)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;place-items:center;z-index:20;padding:20px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px}
.modal h3{font-family:Inter;font-size:20px;margin-bottom:12px}
.modal input{width:100%;border:1.5px solid var(--linha);border-radius:12px;padding:12px;font:inherit;font-size:15px;outline:none}
.modal input:focus{border-color:var(--verde)}
.modal .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal .acoes .btn{padding:10px 18px}
.btn.sec{background:var(--creme);color:var(--sub)}
.modal p{font-size:14px;color:var(--sub);line-height:1.5}
/* tela de acesso */
#acesso{position:fixed;inset:0;background:var(--verde);z-index:50;display:grid;place-items:center;padding:20px}
#acesso.fora{display:none}
.login{width:100%;max-width:380px;color:#fff}
.login .logo{justify-content:center;margin-bottom:22px}
.login h2{font-family:Inter;font-size:28px;text-align:center}
.login .sub{text-align:center;color:var(--claro);font-size:14px;margin:6px 0 24px}
.login label{display:block;font-size:12px;color:var(--claro);margin:12px 0 6px}
.login input{width:100%;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;outline:none}
.login input:focus{border-color:var(--ouro)}
.login .btn{width:100%;padding:14px;margin-top:20px}
.login .erro{color:#ffb3bb;font-size:13px;min-height:18px;margin-top:10px;text-align:center}
.login .frase{margin-top:30px}
.login .frase p{font-size:16px;color:var(--claro)}
.visao{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-left:auto}
.visao button{border:0;background:none;padding:6px 12px;border-radius:999px;font:500 12px Inter;color:var(--sub);cursor:pointer}
.visao button.on{background:var(--creme);color:var(--verde)}
.visao+.busca{margin-left:0}
.colunas{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.catnav{background:#fff;border-radius:16px;padding:10px;box-shadow:0 6px 24px rgba(30,58,47,.07);position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.navtit{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--sub);padding:6px 10px 8px}
.catitem{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;font:500 14px Inter;color:var(--texto);text-align:left;width:100%}
.catitem i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.catitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catitem b{font-size:11px;font-weight:600;color:var(--sub);background:var(--creme);border-radius:999px;padding:1px 7px}
.catitem b:empty{display:none}
.catitem:hover{background:var(--creme)}
.catitem.on{background:var(--c);color:#fff;font-weight:700}
.catitem.on i{background:#fff}
.catitem.on b{background:rgba(255,255,255,.25);color:#fff}
.catitem.novo{color:var(--sub);border-top:1px solid var(--linha);border-radius:0 0 10px 10px;margin-top:6px;padding-top:12px}
.catitem.novo:hover{color:var(--verde)}
.coluna{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(30,58,47,.07);overflow:hidden}
.chead{position:relative;background:var(--c);color:#fff;padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.chead h2{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.15;text-transform:uppercase;margin:2px 0 4px}
.chead small{font-size:13px;opacity:.85}
.chead .crot{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.7}
.cmenu{display:flex;gap:4px}
.cmenu button{border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:13px;padding:6px 9px;border-radius:8px}
.cmenu button:hover{background:rgba(255,255,255,.3)}
.cbar{flex-basis:100%;height:5px;background:rgba(255,255,255,.25);margin-top:12px;border-radius:5px;overflow:hidden}
.cbar i{display:block;height:100%;background:#fff}
.cadd{padding:12px 16px 6px}
.cadd input{width:100%;border:1.5px dashed var(--linha);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;outline:none;background:var(--creme);color:var(--texto)}
.cadd input:focus{border-style:solid;border-color:var(--c);background:#fff}
.clista{list-style:none}
.clista .item{padding:11px 16px}
.cvazio{padding:22px;font-size:13px;color:#b0a995;text-align:center}
.cvaziog{background:#fff;border-radius:16px;padding:50px 20px;text-align:center;color:var(--sub)}
.cvaziog div{font-size:34px;margin-bottom:8px}
.cfeitas{border:0;background:none;width:100%;text-align:left;padding:12px 16px;font:500 13px Inter;color:var(--sub);cursor:pointer;border-top:1px solid var(--linha)}
.cfeitas:hover{background:var(--creme)}
@media(max-width:720px){.colunas{grid-template-columns:1fr}.catnav{position:static;flex-direction:row;overflow-x:auto}.navtit{display:none}.catitem{width:auto;flex:none}.catitem.novo{border-top:0;margin-top:0;padding-top:10px}.chead h2{font-size:22px}}
.paleta{display:flex;gap:8px;flex-wrap:wrap}
.paleta button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linha);cursor:pointer}
.paleta button.on{box-shadow:0 0 0 2px var(--texto)}
@media(max-width:560px){.visao{margin-left:0}}
.titulo{cursor:pointer}
.titulo:hover{text-decoration:underline;text-decoration-color:#cfc6b2}
.tag.subt{cursor:pointer;background:#eef0ec;color:var(--texto)}
.tag.subt.ok{background:#cfe8d6;color:#2a6a3e}
#modal{z-index:30}
.modal .box.det{max-width:560px!important;position:relative;border-top:6px solid var(--c);padding:22px 22px 16px;max-height:90vh;overflow:auto}
.fechar{position:absolute;top:10px;right:12px;border:0;background:none;font-size:24px;color:var(--sub);cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.fechar:hover{background:var(--creme)}
.dtopo{display:flex;gap:12px;align-items:flex-start;padding-right:30px}
.dtopo h3{font-size:21px;font-weight:700;margin:0 0 6px;line-height:1.3}
.dtopo h3.riscado{text-decoration:line-through;color:var(--sub)}
.check.grande{width:26px;height:26px;margin-top:2px}
.check.grande.on{background:var(--verde);border-color:var(--verde)}
.check.grande.on::after{content:"";width:6px;height:11px;border:solid var(--ouro);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dsec{display:flex;align-items:center;gap:12px;margin:22px 0 8px}
.dsec strong{font-size:14px;font-weight:700;white-space:nowrap}
.dprog{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.dbar{flex:1;height:7px;background:var(--creme);border-radius:7px;overflow:hidden}
.dbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.dlista{list-style:none}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px}
.sitem:hover{background:var(--creme)}
.scheck{width:20px;height:20px;border-radius:6px;border:2px solid var(--claro);background:#fff;cursor:pointer;flex:none;display:grid;place-items:center}
.sitem.ok .scheck{background:var(--c);border-color:var(--c)}
.sitem.ok .scheck::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stxt{flex:1;font-size:14px;word-break:break-word}
.sitem.ok .stxt{text-decoration:line-through;color:var(--sub)}
.sdel{border:0;background:none;color:#c2bba9;font-size:18px;cursor:pointer;opacity:0;padding:0 6px}
.sitem:hover .sdel{opacity:1}
.sdel:hover{color:var(--alta)}
.svazio{font-size:13px;color:var(--sub);padding:8px 6px}
.dadd{display:flex;gap:8px;margin-top:10px}
.dadd input{flex:1;border:1.5px solid var(--linha);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;outline:none}
.dadd input:focus{border-color:var(--c)}
.dadd .btn{padding:0 16px;font-size:14px}
.drodape{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--linha);font-size:12px;color:var(--sub)}
.etqs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.elab{font-size:13px;margin-right:2px}
.echip{border:1.5px solid var(--e);background:#fff;color:var(--e);font:600 12px Inter;padding:5px 11px;border-radius:999px;cursor:pointer;user-select:none}
.echip.on{background:var(--e);color:#fff}
.echip.nova{border:1.5px dashed #cfc6b2;color:var(--sub);background:none;font-weight:500}
.echip.nova:hover{border-color:var(--verde);color:var(--verde)}
.tag.etq{color:#fff;font-weight:600}
.feito .tag.etq{opacity:.55}
.apagarl{display:flex!important;align-items:center;gap:8px;margin-top:16px!important;color:var(--alta)!important;cursor:pointer}
.apagarl input{width:auto!important}
#alertas{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
#alertas:empty{display:none}
.alerta{border-radius:16px;padding:14px 16px;box-shadow:0 6px 24px rgba(30,58,47,.08)}
.atit{font-weight:800;font-size:15px;margin-bottom:8px;letter-spacing:-.2px}
.aitens{display:flex;flex-direction:column;gap:6px}
.aitem{display:flex;justify-content:space-between;gap:12px;align-items:center;border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;text-align:left;background:rgba(255,255,255,.18);color:inherit}
.aitem:hover{background:rgba(255,255,255,.3)}
.aitem b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aitem span{font-size:12px;font-weight:600;white-space:nowrap;opacity:.95}
.alerta.vermelho{background:#c8323f;color:#fff;animation:pulsa 1.6s ease-in-out infinite}
.alerta.laranja{background:#e8833a;color:#fff}
.alerta.dourado{background:#fff;border-left:6px solid var(--ouro)}
.alerta.dourado .aitem{background:var(--creme)}
.alerta.dourado .aitem:hover{background:#efe7d4}
.alerta.neutro{background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--sub);box-shadow:none;border:1.5px dashed var(--linha);padding:10px 14px}
.abtn{border:0;background:var(--verde);color:#fff;border-radius:10px;padding:8px 14px;font:600 13px Inter;cursor:pointer;flex:none}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(200,50,63,.55)}50%{box-shadow:0 0 0 8px rgba(200,50,63,0)}}
.tag.embreve{background:#e8833a;color:#fff;font-weight:700}
.tag.atrasada{background:#c8323f!important;color:#fff!important;font-weight:700}
.toast.forte{background:#c8323f;border-left-color:#fff;font-size:15px}
#tHora{width:auto}
@media(max-width:560px){h1{font-size:24px}.busca{margin-left:0;width:100%}}
</style>
</head>
<body>

<!-- acesso -->
<div id="acesso">
  <form class="login" id="loginForm" autocomplete="on">
    <div class="logo"><b>K</b></div>
    <h2 id="lTitulo">Carregando…</h2>
    <p class="sub" id="lSub"></p>
    <div id="lCampos" style="display:none">
      <label for="lEmail">E-mail</label>
      <input type="email" id="lEmail" autocomplete="username" required>
      <label for="lSenha">Senha</label>
      <input type="password" id="lSenha" autocomplete="current-password" required minlength="4">
      <div id="lConfBox" style="display:none">
        <label for="lConf">Confirmar senha</label>
        <input type="password" id="lConf" autocomplete="new-password">
      </div>
      <button class="btn" type="submit" id="lBtn">Entrar</button>
      <div class="erro" id="lErro"></div>
    </div>
    <div class="frase"><p class="fraseTxt"></p></div>
  </form>
</div>

<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><b>K</b><span>Organização do Kaique</span></div>
      <div class="topdir">
        <span class="sync" id="sync">carregando…</span>
        <button class="sair" id="bloquear" title="Bloquear">🔒 Bloquear</button>
      </div>
    </div>
    <h1>Bom trabalho, Kaique</h1>
    <div class="data" id="hoje"></div>
    <div class="frase" id="frase"><p class="fraseTxt"></p></div>
    <div class="stats">
      <div class="stat"><strong id="sPend">0</strong><small>pendentes</small></div>
      <div class="stat"><strong id="sHoje">0</strong><small>para hoje</small></div>
      <div class="stat"><strong id="sAtr">0</strong><small>atrasadas</small></div>
      <div class="stat"><strong id="sFeito">0</strong><small>concluídas</small></div>
    </div>
    <div class="barra"><i id="prog"></i></div>
  </div>
</header>

<main class="wrap">
  <div id="alertas"></div>
  <div class="quadros" id="quadros"></div>

  <form class="nova card" id="form">
    <input type="text" id="tTitulo" placeholder="O que precisa ser feito?" autocomplete="off" maxlength="200">
    <button class="btn" type="submit">Adicionar</button>
    <div class="opts">
      <select id="tQuadro" title="Quadro"></select>
      <select id="tPrio" title="Prioridade">
        <option value="media">🟡 Prioridade média</option>
        <option value="alta">🔴 Prioridade alta</option>
        <option value="baixa">🟢 Prioridade baixa</option>
      </select>
      <input type="date" id="tData" title="Data do prazo">
      <input type="time" id="tHora" title="Horário do prazo">
      <input type="text" id="tCat" list="cats" placeholder="Categoria" maxlength="40" style="flex:1;min-width:130px">
      <datalist id="cats"></datalist>
      <div class="etqs" id="tEtqs"></div>
    </div>
  </form>

  <div class="filtros" id="filtros">
    <button class="chip on" data-f="pendentes">Pendentes</button>
    <button class="chip" data-f="hoje">Hoje</button>
    <button class="chip" data-f="atrasadas">Atrasadas</button>
    <button class="chip" data-f="concluidas">Concluídas</button>
    <button class="chip" data-f="todas">Todas</button>
    <div class="visao"><button type="button" data-v="colunas">▦ Por categoria</button><button type="button" data-v="lista">☰ Lista</button></div>
    <input class="busca" id="busca" placeholder="Buscar…">
  </div>

  <div class="legenda"><span><i style="background:var(--alta)"></i>Alta</span><span><i style="background:var(--media)"></i>Média</span><span><i style="background:var(--baixa)"></i>Baixa</span></div>
  <div id="area"><ul class="lista card" id="lista"></ul><div class="colunas" id="colunas"></div></div>

  <div class="rodape">
    <span id="contagem"></span>
    <button class="link" id="limpar" type="button">Apagar concluídas</button>
  </div>
  <p class="aviso">Clique numa tarefa para abrir o checklist.</p>
</main>

<div class="toast" id="toast"></div>

<div class="modal" id="det">
  <div class="box det" id="detBox">
    <button type="button" class="fechar" data-d="fechar" title="Fechar">×</button>
    <div class="dtopo" id="detTopo"></div>
    <div class="dsec"><strong>🏷 Etiquetas</strong></div>
    <div class="etqs" id="detEtqs"></div>
    <div class="dsec"><strong>☑ Checklist</strong><div class="dprog" id="detProg"></div></div>
    <ul class="dlista" id="detLista"></ul>
    <form id="detAdd" class="dadd"><input id="detNova" placeholder="+ Adicionar item" maxlength="200" autocomplete="off"><button class="btn" type="submit">Adicionar</button></form>
    <div class="drodape"><span>Clique duas vezes num item para editar</span><button type="button" class="link" data-d="editar">✎ Editar tarefa</button></div>
  </div>
</div>

<div class="modal" id="modal">
  <form class="box" id="mForm">
    <h3 id="mTitulo"></h3>
    <div id="mCorpo"></div>
    <div class="acoes">
      <button type="button" class="btn sec" id="mCancelar">Cancelar</button>
      <button type="submit" class="btn" id="mOk">Salvar</button>
    </div>
  </form>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const EMAIL_HASH = "7efe55a081d8565c60d7b9a7b954695d0745225de8974225b6216c992ae42a41";
  const LS = "belarmino-tarefas", LSQ = "kaique-quadros", LSA = "kaique-acesso";
  let tarefas = [];
  let quadros = null;            // [{id,nome}]
  let acesso = null;             // {email,salt,hash}
  let liberado = false;
  let filtro = "pendentes", busca = "", quadroSel = "todos";
  let col = null;
  const LSC = "kaique-categorias", LSV = "kaique-visao";
  let categorias = [];           // [{nome,cor}]
  let visao = "colunas";
  const abertas = new Set();
  let catSel = null;
  const CORES = ["#2F6F4E","#C2410C","#1D4ED8","#7C3AED","#B45309","#0E7490","#BE185D","#4D7C0F","#475569"];
  const corCat = nome => (categorias.find(c=>c.nome===nome)||{}).cor || "#6f7a72";
  function ajustarCategorias(){
    let mudou=false;
    tarefas.forEach(t=>{ if(t.cat && !categorias.some(c=>c.nome===t.cat)){ categorias.push({nome:t.cat, cor:CORES[categorias.length%CORES.length]}); mudou=true; } });
    return mudou;
  }
  const LSE = "kaique-etiquetas";
  let etiquetas = [];            // [{id,nome,cor}]
  let novasEtq = new Set();
  const CORES_ETQ = ["#d1495b","#e8833a","#E9B44C","#4f9d69","#0E7490","#1D4ED8","#7C3AED","#BE185D","#475569","#1E3A2F"];
  async function salvarEtiquetas(){ guardar(LSE, etiquetas); if(col){ try{ await col.doc("_etiquetas").set({lista:etiquetas}); }catch(e){} } }
  const etqHtml = t => (t.etqs||[]).map(id=>etiquetas.find(e=>e.id===id)).filter(Boolean).map(e=>`<span class="tag etq" style="background:${e.cor}">${esc(e.nome)}</span>`).join("");
  const chipsEtq = (sel, acao) => etiquetas.map(e=>`<button type="button" class="echip ${sel.has(e.id)?"on":""}" data-${acao}="etq" data-eid="${e.id}" style="--e:${e.cor}" title="Clique para marcar · duplo clique para editar">${esc(e.nome)}</button>`).join("") + `<button type="button" class="echip nova" data-${acao}="novaetq">+ Nova etiqueta</button>`;
  function paletaE(sel){ return `<div class="paleta">${CORES_ETQ.map(c=>`<button type="button" data-cor="${c}" class="${c===sel?"on":""}" style="background:${c}"></button>`).join("")}</div>`; }
  function novaEtiqueta(depois){
    abrirModal("Nova etiqueta", `<div class="campos"><label>Nome</label><input maxlength="30" placeholder="Ex.: Urgente, Aguardando cliente"><label>Cor</label>${paletaE(CORES_ETQ[etiquetas.length%CORES_ETQ.length])}</div>`, "Criar", n=>{
      if(!n) return; const e={id:novoId("e"), nome:n, cor:document.querySelector("#mCorpo .paleta button.on")?.dataset.cor||CORES_ETQ[0]};
      etiquetas.push(e); salvarEtiquetas(); if(depois) depois(e); render();
    });
  }
  function editarEtiqueta(id){
    const e=etiquetas.find(x=>x.id===id); if(!e) return;
    abrirModal("Editar etiqueta", `<div class="campos"><label>Nome</label><input maxlength="30" value="${esc(e.nome)}"><label>Cor</label>${paletaE(e.cor)}
      <label class="apagarl"><input type="checkbox" id="eApagar"> Apagar esta etiqueta</label></div>`, "Salvar", n=>{
      if($("#eApagar").checked){
        etiquetas=etiquetas.filter(x=>x.id!==id); novasEtq.delete(id);
        tarefas.filter(t=>(t.etqs||[]).includes(id)).forEach(t=>{ t.etqs=t.etqs.filter(x=>x!==id); gravar(t); });
      } else { if(n) e.nome=n; const c=document.querySelector("#mCorpo .paleta button.on")?.dataset.cor; if(c) e.cor=c; }
      salvarEtiquetas(); render();
    });
  }
  async function salvarCategorias(){ guardar(LSC, categorias); if(col){ try{ await col.doc("_categorias").set({lista:categorias}); }catch(e){} } }

  const QUADROS_PADRAO = [
    {id:"q-hoje", nome:"Hoje"},
    {id:"q-agora", nome:"Esta semana"},
    {id:"q-semana", nome:"Para semana que vem"},
    {id:"q-mes", nome:"Para mês que vem"},
    {id:"q-futuro", nome:"Futuramente"}
  ];

  const ler = (k,d) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
  const guardar = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const hojeISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const novoId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  $("#hoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});

  // ---------- frases ----------
  const FRASES = [
    "Cada tarefa que você termina aqui é um tijolo do negócio que vai ser seu.",
    "Esse lugar é a escola, não o destino. Deus já tem o seu próximo capítulo escrito.",
    "Um dia você vai olhar pra trás e agradecer por cada hora que aguentou firme.",
    "Quem é fiel no pouco, Deus coloca sobre o muito.",
    "Hoje você trabalha pelo salário. Amanhã, pelo seu próprio sonho.",
    "Seu próprio patrão: não é se, é quando. Continua.",
    "O que você planta em silêncio, Deus faz crescer em público.",
    "Disciplina hoje, liberdade amanhã.",
    "Você não está preso. Você está sendo preparado.",
    "Cada real que você ganha aqui pode ser semente do que é seu.",
    "Deus abre portas que nenhum chefe consegue fechar.",
    "Seja excelente aqui, porque é assim que se constrói o caráter de um dono.",
    "A sua hora vai chegar. Até lá, faz bem feito.",
    "O CLT paga as contas. O seu sonho paga a alma. Não abandona nenhum dos dois.",
    "Entrega o seu caminho ao Senhor, confia nele, e o mais Ele fará.",
    "Grandes negócios começaram com alguém cansado que não desistiu.",
    "Você vai ter a sua própria empresa, a sua agenda e a sua liberdade.",
    "Respira. Faz o próximo passo. Deus cuida do resto.",
    "O que é seu está guardado. Ninguém tira.",
    "Hoje você bate ponto. Um dia vai gerar emprego pra muita gente.",
    "Não é sobre sair daqui correndo. É sobre sair daqui pronto.",
    "A bênção vem. Continua trabalhando como quem já sabe disso.",
    "Cada hora aqui é um treino para o dia em que você vai mandar no seu tempo.",
    "Deus não te trouxe até aqui pra te deixar aqui.",
    "Seu nome ainda vai estar na porta da sua própria empresa.",
    "Foco no hoje, fé no amanhã.",
    "Quem tem visão aguenta o processo.",
    "Você está mais perto do que imagina. Não para agora.",
    "O tempo de Deus é perfeito. O seu esforço é a parte que te cabe.",
    "Um dia esse emprego vai ser só uma parte bonita da sua história."
  ];
  let horaAtual = null;
  function atualizarFrase(){
    const h = new Date().getHours(); if(h===horaAtual) return;
    const primeira = horaAtual===null; horaAtual=h;
    const f = FRASES[Math.floor(Date.now()/3600000) % FRASES.length];
    const el=$("#frase"); el.style.opacity=0;
    setTimeout(()=>{ document.querySelectorAll(".fraseTxt").forEach(p=>p.textContent=f); el.style.opacity=1; }, primeira?0:600);
    if(!primeira && liberado){ const t=$("#toast"); t.textContent=f; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),9000); }
  }
  atualizarFrase(); setInterval(atualizarFrase, 30000);

  // ---------- acesso (e-mail e senha) ----------
  async function sha(txt){ try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return ""; } }
  async function hashSenha(email, senha, salt){
    const txt = salt+"|"+email.trim().toLowerCase()+"|"+senha;
    try{
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
    }catch(e){ let h=0; for(const c of txt){ h=(h*31+c.charCodeAt(0))|0; } return "x"+h; }
  }
  function sessaoOk(){ try{ return sessionStorage.getItem(LSA+"-ok")==="1"; }catch(e){ return false; } }
  function marcarSessao(v){ try{ v?sessionStorage.setItem(LSA+"-ok","1"):sessionStorage.removeItem(LSA+"-ok"); }catch(e){} }

  let modoCriar = false;
  function telaAcesso(){
    if(liberado) return;
    $("#lCampos").style.display="block";
    if(acesso && acesso.eh!==EMAIL_HASH) acesso=null;
    modoCriar = !acesso;
    $("#lTitulo").textContent = modoCriar ? "Crie seu acesso" : "Bem-vindo de volta";
    $("#lSub").textContent = modoCriar ? "Defina o e-mail e a senha para abrir sua organização." : "Entre com seu e-mail e senha.";
    $("#lConfBox").style.display = modoCriar ? "block" : "none";
    $("#lSenha").autocomplete = modoCriar ? "new-password" : "current-password";
    $("#lBtn").textContent = modoCriar ? "Criar acesso" : "Entrar";
    if(acesso && !$("#lEmail").value) $("#lEmail").value = acesso.email;
    setTimeout(()=>($("#lEmail").value?$("#lSenha"):$("#lEmail")).focus(),50);
  }
  function liberar(){ liberado=true; marcarSessao(true); $("#acesso").classList.add("fora"); $("#lSenha").value=""; $("#lConf").value=""; render(); setTimeout(checarPrazos,1500); }
  function bloquear(){ liberado=false; marcarSessao(false); $("#acesso").classList.remove("fora"); $("#lista").innerHTML=""; telaAcesso(); }
  $("#bloquear").addEventListener("click", bloquear);

  $("#loginForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const email=$("#lEmail").value.trim(), senha=$("#lSenha").value; const erro=$("#lErro"); erro.textContent="";
    if(await sha(email.trim().toLowerCase())!==EMAIL_HASH){ erro.textContent="Este e-mail não tem acesso."; return; }
    if(!email || senha.length<4){ erro.textContent="Use uma senha com pelo menos 4 caracteres."; return; }
    if(modoCriar){
      if(senha!==$("#lConf").value){ erro.textContent="As senhas não conferem."; return; }
      const salt=novoId("s"); acesso={email:email.toLowerCase(), eh:EMAIL_HASH, salt, hash:await hashSenha(email,senha,salt)};
      guardar(LSA, acesso);
      if(col){ try{ await col.doc("_acesso").set(acesso); }catch(e){} }
      liberar();
    } else {
      const h = await hashSenha(email, senha, acesso.salt);
      if(h===acesso.hash && email.toLowerCase()===acesso.email) liberar();
      else { erro.textContent="E-mail ou senha incorretos."; $("#lSenha").select(); }
    }
  });

  // ---------- quadros ----------
  const noQuadro = (t,id) => id==="todos" || t.quadro===id || (id==="q-hoje" && t.data===hojeISO());
  const nomeQuadro = id => (quadros.find(q=>q.id===id)||{}).nome || "Sem quadro";
  async function salvarQuadros(){ guardar(LSQ, quadros); if(col){ try{ await col.doc("_quadros").set({lista:quadros}); }catch(e){} } }

  function renderQuadros(){
    const pend = id => tarefas.filter(t=>!t.feito && noQuadro(t,id)).length;
    let html = `<button class="quadro ${quadroSel==="todos"?"on":""}" data-q="todos"><strong>Tudo</strong><small>${pend("todos")} pendentes</small></button>`;
    html += quadros.map(q=>`<button class="quadro ${quadroSel===q.id?"on":""}" data-q="${q.id}">
      <span class="qmenu"><span data-qa="ren" title="Renomear">✎</span>${q.id==="q-hoje"?"":`<span data-qa="del" title="Apagar quadro">🗑</span>`}</span>
      <strong>${esc(q.nome)}</strong><small>${pend(q.id)} pendentes</small></button>`).join("");
    html += `<button class="quadro novo" data-q="novo">+ Novo quadro</button>`;
    $("#quadros").innerHTML = html;
    const opts = quadros.map(q=>`<option value="${q.id}">${esc(q.nome)}</option>`).join("");
    const sel=$("#tQuadro"); const atual = quadroSel!=="todos" ? quadroSel : (sel.value && quadros.some(q=>q.id===sel.value) ? sel.value : quadros[0]?.id);
    sel.innerHTML = opts; if(atual) sel.value = atual;
  }

  // modal simples
  let mAcao=null;
  function abrirModal(titulo, corpoHtml, okTxt, acao){
    $("#mTitulo").textContent=titulo; $("#mCorpo").innerHTML=corpoHtml; $("#mOk").textContent=okTxt; mAcao=acao;
    $("#modal").classList.add("on"); const i=$("#mCorpo input"); if(i){ i.focus(); i.select(); }
  }
  const fecharModal = ()=>{ $("#modal").classList.remove("on"); mAcao=null; };
  $("#mCancelar").addEventListener("click", fecharModal);
  $("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") fecharModal(); });
  $("#mForm").addEventListener("submit", e=>{ e.preventDefault(); const a=mAcao; const v=$("#mCorpo input")?.value?.trim(); if(a) a(v); fecharModal(); });

  $("#quadros").addEventListener("click", e=>{
    const b=e.target.closest(".quadro"); if(!b) return;
    const qa=e.target.closest("[data-qa]"); const id=b.dataset.q;
    if(id==="novo"){
      abrirModal("Novo quadro", `<input maxlength="40" placeholder="Ex.: Para o fim do ano">`, "Criar", nome=>{
        if(!nome) return; const q={id:novoId("q"),nome}; quadros.push(q); quadroSel=q.id; salvarQuadros(); render();
      }); return;
    }
    if(qa && qa.dataset.qa==="ren"){
      const q=quadros.find(x=>x.id===id);
      abrirModal("Renomear quadro", `<input maxlength="40" value="${esc(q.nome)}">`, "Salvar", nome=>{ if(nome){ q.nome=nome; salvarQuadros(); render(); } }); return;
    }
    if(qa && qa.dataset.qa==="del"){
      const q=quadros.find(x=>x.id===id); const n=tarefas.filter(t=>t.quadro===id).length;
      if(quadros.length<=1){ abrirModal("Não dá pra apagar", `<p>Você precisa ter pelo menos um quadro.</p>`, "Ok", null); return; }
      const destino = quadros.find(x=>x.id!==id && x.id!=="q-hoje") || quadros.find(x=>x.id!==id);
      abrirModal(`Apagar "${q.nome}"?`, `<p>${n?`As ${n} tarefa(s) desse quadro vão para "${esc(destino.nome)}".`:"O quadro está vazio."}</p>`, "Apagar", ()=>{
        tarefas.filter(t=>t.quadro===id).forEach(t=>{ t.quadro=destino.id; gravar(t); });
        quadros=quadros.filter(x=>x.id!==id); quadroSel="todos"; salvarQuadros(); render();
      }); return;
    }
    quadroSel=id; render();
  });

  // ---------- lista ----------
  const ordemPrio={alta:0,media:1,baixa:2};
  function render(){
    if(!quadros) return;
    renderQuadros();
    const h=hojeISO(); const pend=tarefas.filter(t=>!t.feito);
    $("#sPend").textContent=pend.length;
    $("#sHoje").textContent=pend.filter(t=>t.data===h).length;
    $("#sAtr").textContent=pend.filter(atr).length;
    $("#sFeito").textContent=tarefas.length-pend.length;
    $("#prog").style.width=tarefas.length?((tarefas.length-pend.length)/tarefas.length*100)+"%":"0";
    if(!liberado) return;

    if(ajustarCategorias()) salvarCategorias();
    $("#cats").innerHTML=categorias.map(c=>c.nome).map(c=>`<option value="${esc(c)}">`).join("");
    let v=tarefas.filter(t=>noQuadro(t,quadroSel)).filter(t=>{
      if(filtro==="pendentes") return !t.feito;
      if(filtro==="hoje") return !t.feito&&t.data===h;
      if(filtro==="atrasadas") return !t.feito&&atr(t);
      if(filtro==="concluidas") return t.feito;
      return true;
    });
    if(busca){ const b=busca.toLowerCase(); v=v.filter(t=>(t.titulo+" "+(t.cat||"")).toLowerCase().includes(b)); }
    const dk=t=>t.data||"9999";
    v.sort((a,b)=>(a.feito-b.feito)||(ordemPrio[a.prio]-ordemPrio[b.prio])||(dk(a)<dk(b)?-1:dk(a)>dk(b)?1:0)||(a.criado-b.criado));

    const opts=id=>quadros.map(q=>`<option value="${q.id}" ${q.id===id?"selected":""}>${esc(q.nome)}</option>`).join("");
    const itemHtml=(t,semCat)=>{
      let dt="";
      if(t.data) dt=tagPrazo(t);
      const cc=corCat(t.cat);
      return `<li class="item pr-${t.prio} ${t.feito?"feito":""}" data-id="${t.id}">
        <span class="prio p-${t.prio}" title="Prioridade ${t.prio}"></span>
        <button class="check" data-a="toggle" aria-label="Concluir"></button>
        <div class="corpo"><div class="titulo" data-a="abrir" title="Abrir tarefa">${esc(t.titulo)}</div>
        <div class="meta"><span class="tag tp-${t.prio}">${{alta:"🔴 Alta",media:"🟡 Média",baixa:"🟢 Baixa"}[t.prio]}</span>${etqHtml(t)}${(t.subs||[]).length?`<span class="tag subt ${t.subs.every(x=>x.ok)?"ok":""}" data-a="abrir">☑ ${t.subs.filter(x=>x.ok).length}/${t.subs.length}</span>`:""}<select class="mover" title="Mover para outro quadro">${opts(t.quadro)}</select>${t.cat&&!semCat?`<span class="tag cat" style="background:${cc}1f;color:${cc}">● ${esc(t.cat)}</span>`:""}${dt}</div></div>
        <button class="ed" data-a="editar" title="Editar">✎</button><button class="del" data-a="del" title="Apagar">×</button></li>`;
    };
    const ul=$("#lista"), cols=$("#colunas");
    ul.style.display = visao==="lista" ? "" : "none";
    cols.style.display = visao==="colunas" ? "" : "none";

      });
    }
    if(acao==="feitas"){ abertas.has(nome)?abertas.delete(nome):abertas.add(nome); render(); }
  });

  // ---------- início ----------
  function ajustarQuadros(){
    if(!quadros || !quadros.length) quadros = QUADROS_PADRAO.map(q=>({...q}));
    if(!quadros.some(q=>q.id==="q-hoje")) quadros.unshift({id:"q-hoje", nome:"Hoje"});
    const ids=new Set(quadros.map(q=>q.id)); let mudou=false;
    tarefas.forEach(t=>{ if(!ids.has(t.quadro)){ t.quadro=quadros[0].id; mudou=true; } });
    return mudou;
  }
  tarefas=ler(LS,[]); quadros=ler(LSQ,null); acesso=ler(LSA,null); categorias=ler(LSC,[]); etiquetas=ler(LSE,[]); visao=ler(LSV,"colunas"); catSel=ler("kaique-catsel",null);
  ajustarCategorias();
  ajustarQuadros();
  if(acesso && acesso.eh!==EMAIL_HASH) acesso=null;
  if(acesso && sessaoOk()) liberar();
  else if(acesso) telaAcesso();
  render(); setSync("salvo neste navegador");

  let decidido = !!acesso;
  const esperaAcesso = setTimeout(()=>{ if(!decidido){ decidido=true; telaAcesso(); } }, 6000);

  (async()=>{
    try{
      if(!window.claude||!window.claude.use){ decidido=true; clearTimeout(esperaAcesso); telaAcesso(); return; }
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      const uid = db&&user ? await user.id() : null;
      if(!uid){ decidido=true; clearTimeout(esperaAcesso); telaAcesso(); return; }
      col=db.collection("data/users/"+uid); setSync("sincronizando…");
      const timer=setTimeout(()=>setSync("sem conexão — salvo neste navegador"),10000);
      let primeira=true;
      col.onSnapshot(snap=>{
        if(primeira && snap.metadata.fromCache) return;
        const docs=snap.docs.filter(d=>d.exists);
        const remotas=docs.filter(d=>!d.id.startsWith("_")).map(d=>({...d.data()}));
        const dq=docs.find(d=>d.id==="_quadros"), da=docs.find(d=>d.id==="_acesso"), dc=docs.find(d=>d.id==="_categorias"), de=docs.find(d=>d.id==="_etiquetas");
        if(de && Array.isArray(de.data().lista)) etiquetas=de.data().lista.map(x=>({...x}));
        if(dc && Array.isArray(dc.data().lista)) categorias=dc.data().lista.map(c=>({...c}));
        if(primeira){
          primeira=false;
          const ids=new Set(remotas.map(t=>t.id));
          const faltam=tarefas.filter(t=>!ids.has(t.id));
          tarefas=remotas.concat(faltam);
          if(dq) quadros=dq.data().lista;
          const mudou = ajustarQuadros();
          (async()=>{
            if(!dq) await salvarQuadros();
            for(const t of (mudou?tarefas:faltam)){ try{ await col.doc(t.id).set(t); }catch(e){} }
            if(!da && acesso){ try{ await col.doc("_acesso").set(acesso); }catch(e){} }
          })();
          if(da && da.data().eh===EMAIL_HASH){ const novo=da.data(); if(!acesso || novo.hash!==acesso.hash){ acesso={...novo}; if(liberado && !sessaoOk()) bloquear(); } }
          if(!decidido || !liberado){ decidido=true; clearTimeout(esperaAcesso); if(!liberado){ if(acesso && sessaoOk()) liberar(); else telaAcesso(); } }
        } else {
          tarefas=remotas;
          if(dq) quadros=dq.data().lista;
          if(da && da.data().eh===EMAIL_HASH) acesso={...da.data()};
          ajustarQuadros();
        }
        if(ajustarCategorias() || !dc) salvarCategorias();
        if(!de && etiquetas.length) salvarEtiquetas();
        guardar(LS,tarefas); guardar(LSQ,quadros); if(acesso) guardar(LSA,acesso);
        clearTimeout(timer); setSync("☁ sincronizado"); render();
      }, ()=>{ clearTimeout(timer); col=null; setSync("salvo neste navegador"); if(!decidido){ decidido=true; telaAcesso(); } });
    }catch(e){ if(!decidido){ decidido=true; telaAcesso(); } }
  })();
})();
</script>
