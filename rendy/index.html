<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Rendy — Finanças pessoais e MEI</title>
<meta name="theme-color" content="#0B2540">
<meta name="description" content="Organize sua renda, gastos, metas e o caixa do seu MEI em um só app.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
/* VOICE: app de banco sério, claro e explicativo
   IDEA: extrato bancário + cofre de metas
   PICTURE: cartão de saldo grande no topo, barras de progresso
   COLOUR/TYPE: marinho #0B2540, verde dinheiro, dourado; IBM Plex Sans
   LAYOUT: coluna única mobile, navegação inferior */
:root{
  --navy:#0B2540; --navy-2:#13395f; --green:#0A8F63; --green-soft:#E2F4EC; --red:#C93C3C; --red-soft:#FBEAEA;
  --gold:#C9962B; --gold-soft:#FBF3E1; --bg:#F1F4F8; --card:#FFFFFF; --ink:#101B27; --muted:#5F6B7A; --line:#E1E6ED;
  --accent:var(--green); --accent-soft:var(--green-soft);
}
body.mei{--accent:#2563C9; --accent-soft:#E5EDFB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0}
body{font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num,.money{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px} svg.i.l{width:24px;height:24px}

.top{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 64px;border-radius:0 0 24px 24px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
.logo b{width:36px;height:36px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--navy);font:800 21px Manrope,sans-serif;padding-bottom:3px}.logo b i{color:var(--gold);font-style:normal}.logo .wm{font:800 21px Manrope,sans-serif;letter-spacing:-.03em;line-height:1.1}
.hello{font-size:13px;color:#a9bbd0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.seg{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.1);border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:11px;color:#c3d1e1;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:#fff;color:var(--navy)}
.month{margin-top:14px;justify-content:center;gap:14px;font-weight:500;color:#dbe4ef}
.month button{color:#fff;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.month span{min-width:160px;text-align:center}

main{padding:0 16px;margin-top:-48px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 6px 24px -14px rgba(11,37,64,.22);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.bar i{transition:none}}
.label{font-size:13px;color:var(--muted);font-weight:500}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:2px;line-height:1.15}
.mid{font-size:22px;font-weight:700;letter-spacing:-.01em}
.hide .money{filter:blur(8px)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pill{border-radius:14px;padding:12px}
.pill.in{background:var(--green-soft)} .pill.out{background:var(--red-soft)}
.pill .label{display:flex;align-items:center;gap:6px}
.pill b{display:block;font-size:17px;margin-top:2px}
.in-c{color:var(--green)} .out-c{color:var(--red)}
h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
h3 svg{color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hint svg{margin-top:1px;color:#93a0b0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:var(--gold)} .bar.bad i{background:var(--red)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{background:var(--card);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;box-shadow:0 6px 24px -16px rgba(11,37,64,.3)}
.quick button span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.quick button:nth-child(2) span{background:var(--red-soft);color:var(--red)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;margin-top:14px;font-size:14px}
.cat .ic{grid-row:span 2;width:36px;height:36px;border-radius:10px}
.cat .bar{grid-column:2/-1;height:6px;margin:4px 0 0}
.cat small{color:var(--muted);font-size:12px;margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:14px}
.empty svg{color:#a7b2c0;width:34px;height:34px;margin-bottom:6px}
.link{color:var(--accent);font-weight:600;font-size:14px}

/* insights */
.ins{display:grid;gap:10px;margin-top:12px}
.ins div{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.ins .ic{width:34px;height:34px;border-radius:10px}
.ins .g{background:var(--green-soft);color:var(--green)} .ins .r{background:var(--red-soft);color:var(--red)}
.ins .y{background:var(--gold-soft);color:var(--gold)} .ins .b{background:#E5EDFB;color:#2563C9}

/* extrato */
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .t{flex:1}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .v{font-weight:600;text-align:right;white-space:nowrap}
.tx .del{color:#9aa6b4;padding:6px}
.day{font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 2px}
.filters{display:flex;gap:8px;overflow:auto}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:14px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bars i{width:42%;max-width:14px;border-radius:4px 4px 2px 2px;background:var(--green);min-height:2px;transition:height .8s}
.chart .bars i.o{background:var(--red)}
.chart .col.cur small{color:var(--ink);font-weight:700}
.chart small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--green)}
.legend span.o::before{background:var(--red)}

/* metas */
.goal{padding:0;overflow:hidden}
.goal .cover{height:140px;background:center/cover no-repeat var(--navy);position:relative;display:flex;align-items:flex-end;padding:14px 16px;color:#fff}
.goal .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,37,64,0) 30%,rgba(11,37,64,.85))}
.goal .cover>*{position:relative}
.goal .cover.noimg{height:auto;background:var(--card);color:var(--ink);padding:16px 16px 0}
.goal .cover.noimg::before{display:none}
.goal .cover h3{font-size:18px}
.goal .cover .sub{color:inherit;opacity:.8}
.goal .photo{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.9);color:var(--navy);display:grid;place-items:center}
.goal .cover.noimg .photo{position:static;background:var(--bg);margin-left:auto}
.goal .body{padding:14px 16px 16px}
.goal .pctrow{display:flex;align-items:baseline;justify-content:space-between}
.goal .pct{font-size:28px;font-weight:700;color:var(--accent)}
.goal .bar{height:12px}
.goal .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.goal .facts div{background:var(--bg);border-radius:12px;padding:10px}
.goal .facts b{display:block;font-size:15px}
.goal .msg{margin-top:12px;font-size:14px;background:var(--accent-soft);border-radius:12px;padding:11px 12px}
.goal .acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}
.btn{background:var(--accent);color:#fff;font-weight:600;border-radius:14px;padding:13px 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.full{width:100%}
.btn.dark{background:var(--navy)}
.btn.danger{background:var(--red)}

.calc .screen{background:var(--navy);color:#fff;border-radius:16px;padding:16px;text-align:right;margin-top:12px}
.calc .screen small{display:block;color:#9fb2c8;min-height:20px;font-size:14px;word-break:break-all}
.calc .screen b{display:block;font-size:34px;font-weight:600;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.keys button{height:56px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:500}
.keys button.op{background:var(--accent-soft);color:var(--accent);font-weight:600}
.keys button.eq{background:var(--accent);color:#fff}
.keys button.fn{color:var(--muted)}
.tool{display:grid;gap:10px;margin-top:12px}
.result{background:var(--accent-soft);border-radius:14px;padding:14px;font-size:14px}
.result b.r{font-size:22px;display:block;margin:2px 0}

.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;outline:none;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent)}
.money-in{font-size:26px!important;font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{padding:12px;border-radius:12px;background:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.toggle button.on.in{background:var(--green);color:#fff}
.toggle button.on.out{background:var(--red);color:#fff}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icons button{height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.icons button.on{background:var(--navy);color:#fff}
.upload{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;cursor:pointer}
.upload .thumb{width:56px;height:56px;border-radius:12px;background:var(--bg) center/cover;display:grid;place-items:center;color:var(--muted);flex:none}

.sheet-bg{position:fixed;inset:0;background:rgba(11,37,64,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .25s;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:700}
.sheet .form{display:grid;gap:12px;margin-top:12px}

.onb{text-align:center;padding:6px 4px 4px}
.onb .ic{width:72px;height:72px;border-radius:22px;margin:4px auto 14px;background:var(--accent-soft);color:var(--accent)}
.onb .ic svg{width:34px;height:34px}
.onb p{color:var(--muted);margin:8px 0 18px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{width:20px;background:var(--accent)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#8592a2;padding:6px 0}
nav button.on{color:var(--accent)}
nav .add span{width:48px;height:48px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 8px 20px -6px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(170deg,var(--navy) 0%,var(--navy-2) 55%,var(--bg) 55.1%);overflow:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
#gate .wrap{max-width:420px;margin:0 auto}
#gate .brand{display:flex;align-items:center;gap:10px;color:#fff;font:800 26px Manrope,sans-serif;letter-spacing:-.03em}
#gate .brand b{width:44px;height:44px;border-radius:13px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font:800 26px Manrope,sans-serif;padding-bottom:4px}
#gate .brand b i{color:var(--gold);font-style:normal}
#gate .lead{color:#c3d1e1;margin:14px 0 22px;font-size:15px}
#gate .card{animation:none;display:grid;gap:12px}
#gate h1{margin:0;font-size:22px;color:#fff}
#gate .err{color:var(--red);font-size:14px;margin:0;min-height:0}
#gate .ok{color:var(--green);font-size:14px;margin:0}
#gate .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
#gate .tabs button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
#gate .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(11,37,64,.3)}
#gate .lk{color:var(--accent);font-weight:600;font-size:14px;padding:6px;justify-self:center}
#gate .credit{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
#gate dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}#gate dt{color:var(--muted)}#gate dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.iconbtn{position:relative}
.member{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .t{flex:1;font-size:14px}.member .t b{display:block}.member .t span{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.member .acts{display:flex;gap:6px}.member a{color:var(--accent)}
.mini{padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px;background:var(--accent);color:#fff}
.mini.ghost{background:var(--bg);color:var(--ink)}
.group{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 4px}

#splash{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;overflow:hidden;transition:opacity .55s cubic-bezier(.22,.8,.24,1),transform .55s cubic-bezier(.22,.8,.24,1)}
#splash.sai{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
@media (prefers-reduced-motion: reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important}}

#splash{background:linear-gradient(160deg,#13395f 0%,#0B2540 60%,#081b30 100%)}
.rd-marca{position:relative;width:92px;height:92px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.25);transform:scale(.4);opacity:0;animation:rdPop .5s .1s cubic-bezier(.34,1.56,.64,1) forwards}
.rd-r{font:800 56px/1 Manrope,sans-serif;color:#0B2540;margin-top:-8px;opacity:0;transform:translateY(10px);animation:rdSobe .35s .45s cubic-bezier(.22,.8,.24,1) forwards}
.rd-ponto{position:absolute;width:14px;height:14px;border-radius:3px;background:#C9962B;left:56px;top:-60px;opacity:0;animation:rdCai .55s .7s cubic-bezier(.3,0,.4,1) forwards}
.rd-graf{position:relative;width:150px;height:56px;display:flex;align-items:flex-end;gap:8px;padding:0 6px}
.rd-graf i{flex:1;height:var(--h);border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#14b07c,#0A8F63);transform-origin:bottom;transform:scaleY(0);animation:rdBarra .45s cubic-bezier(.22,.8,.24,1) forwards;animation-delay:calc(1.05s + var(--i)*80ms)}
.rd-graf svg{position:absolute;inset:0;width:100%;height:100%}
.rd-linha{stroke-dasharray:1;stroke-dashoffset:1;animation:rdTraco .6s 1.45s cubic-bezier(.65,0,.35,1) forwards}
.rd-nome{font:800 34px/1 Manrope,sans-serif;letter-spacing:-.04em;color:#fff;opacity:0;animation:rdSobe .45s 1.2s cubic-bezier(.22,.8,.24,1) forwards}
.rd-tag{font:500 14px "IBM Plex Sans",sans-serif;color:#9fb4cc;opacity:0;animation:rdSobe .45s 1.4s ease forwards}
@keyframes rdPop{to{transform:none;opacity:1}}
@keyframes rdSobe{to{opacity:1;transform:none}}
@keyframes rdCai{0%{opacity:1;top:-60px}60%{top:62px}75%{top:54px}90%{top:62px}100%{opacity:1;top:60px}}
@keyframes rdBarra{to{transform:scaleY(1)}}
@keyframes rdTraco{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-in">
  <div class="rd-marca"><span class="rd-r">r</span><i class="rd-ponto"></i></div>
  <div class="rd-graf">
    <i style="--h:28%;--i:0"></i><i style="--h:46%;--i:1"></i><i style="--h:38%;--i:2"></i><i style="--h:64%;--i:3"></i><i style="--h:88%;--i:4"></i>
    <svg viewBox="0 0 100 50" preserveAspectRatio="none"><path class="rd-linha" pathLength="1" d="M4 40 L26 30 L48 34 L70 20 L96 6" fill="none" stroke="#C9962B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="rd-nome">rendy</div>
  <div class="rd-tag">Finanças pessoais e MEI</div>
</div></div>
<script>(function(){var sp=document.getElementById("splash");var calmo=false;try{calmo=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
setTimeout(function(){sp.classList.add("sai");setTimeout(function(){sp.remove()},600)},calmo?300:2200);})();</script>

<header class="top">
  <div class="row between">
    <div class="logo"><b>r<i>.</i></b><div><span class="wm">rendy</span><div class="hello" id="hello"></div></div></div>
    <div class="row">
      <button class="iconbtn" id="eye" aria-label="Esconder valores"></button>
      <button class="iconbtn hidden" id="adm" aria-label="Clientes" data-i="users"><span class="badge hidden" id="admBadge"></span></button>

const pct = (a,b) => b>0 ? Math.max(0,Math.min(100, a/b*100)) : 0;
const fp = p => (Math.round(p*10)/10).toLocaleString("pt-BR") + "%";

function limiteMEI(y){ if(db.mei.limite>0) return db.mei.limite; return y>=2028?140000:y===2027?110000:81000; }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1900); }
function mes(a, k){ const l=db[a].lanc.filter(x=>x.data.slice(0,7)===k); const e=l.filter(x=>x.tipo==="in").reduce((s,x)=>s+x.valor,0); const o=l.filter(x=>x.tipo==="out").reduce((s,x)=>s+x.valor,0); return {l,e,o,s:e-o}; }
const bar = (p,cls="") => `<div class="bar ${cls}"><i data-w="${p}"></i></div>`;
const hint = t => `<div class="hint">${I("info","s")}<span>${t}</span></div>`;

/* ---------- telas ---------- */
function render(){
  document.body.classList.toggle("mei", area==="mei");
  document.body.classList.toggle("hide", !!db.hide);
  const t=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); document.getElementById("mlabel").textContent=t[0].toUpperCase()+t.slice(1);
  const h=now.getHours(); document.getElementById("hello").textContent = (h<12?"Bom dia":h<18?"Boa tarde":"Boa noite") + (area==="mei"?" · Empresa":" · Pessoal");
  const eye=document.getElementById("eye"); eye.innerHTML=I(db.hide?"eye-off":"eye");
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.area===area));
  document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.querySelector(".month").classList.toggle("hidden", tab==="calc" || tab==="metas");
  const v=document.getElementById("view");
  v.innerHTML = tab==="inicio" ? (area==="pessoal"?inicioPessoal():inicioMEI()) : tab==="extrato" ? extrato() : tab==="metas" ? metas() : calc();
  animate(v);
  if(tab==="calc") bindCalc();
}
function animate(root){
  requestAnimationFrame(()=>{ root.querySelectorAll(".bar i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%"); root.querySelectorAll(".chart i[data-h]").forEach(i=>i.style.height=i.dataset.h+"%"); });
  root.querySelectorAll("[data-to]").forEach(el=>{ const to=+el.dataset.to, t0=performance.now(), d=700; const step=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=brl(to*e); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
}

function quick(){
  return `<div class="quick">
    <button data-act="in"><span>${I("arrow-up-right")}</span>Entrada</button>
    <button data-act="out"><span>${I("arrow-down-left")}</span>Saída</button>
    <button data-go="metas"><span>${I("target")}</span>Metas</button>
    <button data-go="calc"><span>${I("calculator")}</span>Calcular</button>
  </div>`;
}
function gastosCat(l,total){
  const by={}; l.filter(x=>x.tipo==="out").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.valor);
  const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!arr.length) return `<div class="empty">${I("chart-column")}<br>Nenhum gasto neste mês ainda.<br>Toque em <b>Saída</b> para registrar.</div>`;
  return arr.map(([c,v])=>`<div class="cat">${catIc(c)}<span>${esc(c)}<small>${fp(pct(v,total))}</small></span><b>${M(v)}</b>${bar(pct(v,total))}</div>`).join("");
}
function resumoMetas(){
  const ms=db[area].metas; if(!ms.length) return `<div class="card"><h3>${I("target")}Metas</h3><div class="sub" style="margin-top:6px">Quer juntar dinheiro pra algo? Crie uma meta e acompanhe quanto falta em reais e em porcentagem.</div><button class="btn full" style="margin-top:12px" data-new-goal>${I("plus")}Criar primeira meta</button></div>`;
  const g=ms.reduce((s,m)=>s+m.guardado,0), a=ms.reduce((s,m)=>s+m.alvo,0);
  return `<div class="card"><div class="row between"><h3>${I("target")}Suas metas</h3><button class="link" data-go="metas">Ver todas</button></div>
    <div class="sub" style="margin-top:6px">${ms.length} ${ms.length>1?"metas":"meta"} · guardado ${M(g)} de ${M(a)}</div>${bar(pct(g,a))}
    <div class="sub" style="margin-top:8px">Você já juntou <b>${fp(pct(g,a))}</b> do total. Faltam ${M(Math.max(a-g,0))}.</div></div>`;
}
const insightsCard = (list,title) => list.length ? `<div class="card"><h3>${I("lightbulb")}${title}</h3><div class="ins">${list.map(([c,ic,t])=>`<div><div class="ic ${c}">${I(ic,"s")}</div><span>${t}</span></div>`).join("")}</div></div>` : "";

function inicioPessoal(){
  const p=db.pessoal, {l,e,o,s}=mes("pessoal",curYM()), renda=p.renda||0;
  const uso=pct(o,renda||e), cls=uso>=90?"bad":uso>=70?"warn":"";
  const prevD=new Date(cur.getFullYear(),cur.getMonth()-1,1), prev=mes("pessoal",ymOf(prevD));
  const ins=[];
  if(prev.o>0 && o>0){ const d=(o-prev.o)/prev.o*100; ins.push(d>0?["r","trending-up",`Você gastou <b>${fp(d)} a mais</b> que em ${mName(prevD)} (${brl(prev.o)}).`]:["g","trending-down",`Você gastou <b>${fp(-d)} a menos</b> que em ${mName(prevD)}. Muito bem!`]); }
  const by={}; l.filter(x=>x.tipo==="out").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.valor); const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  if(top) ins.push(["y","chart-column",`Seu maior gasto é <b>${esc(top[0])}</b>: ${brl(top[1])}, ou ${fp(pct(top[1],o))} de tudo que saiu.`]);
  if(curYM()===today().slice(0,7) && o>0){ const dia=now.getDate(), dm=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(), proj=o/dia*dm;
    ins.push([renda&&proj>renda?"r":"b","calendar",`No ritmo de hoje (${brl(o/dia)} por dia), você termina o mês gastando cerca de <b>${brl(proj)}</b>${renda?(proj>renda?", <b>mais do que ganha</b>.":`, sobrando ${brl(renda-proj)}.`):"."}`]); }
  if(renda) ins.push(["g","piggy-bank",`Dica: tente guardar <b>20% da renda</b> todo mês. Pra você, isso é <b>${brl(renda*.2)}</b>.`]);
  return `
  <div class="card">
    <div class="label">Saldo do mês</div>
    <div class="big ${s<0?"out-c":""}">${M(s,1)}</div>
    <div class="split">
      <div class="pill in"><div class="label">${I("arrow-up-right","s")}Entrou</div><b class="in-c">${M(e,1)}</b></div>
      <div class="pill out"><div class="label">${I("arrow-down-left","s")}Saiu</div><b class="out-c">${M(o,1)}</b></div>
    </div>
    ${hint("Saldo é tudo que entrou menos tudo que saiu neste mês. Use as setas lá em cima para ver outros meses.")}
  </div>
  ${quick()}
  <div class="card">
    <div class="row between"><h3>${I("wallet")}Renda mensal</h3><button class="link" data-act="renda">${renda?"Editar":"Definir"}</button></div>
    ${renda ? `<div class="mid" style="margin-top:6px">${M(renda)}</div>
      <div class="sub">Você já usou <b>${fp(pct(o,renda))}</b> da sua renda. Ainda sobram ${M(renda-o)}.</div>${bar(uso,cls)}
      ${hint(uso>=90?"Atenção: você está perto de gastar tudo o que ganha.":uso>=70?"Cuidado: já passou de 70% da renda.":"A barra fica amarela em 70% e vermelha em 90% da renda.")}`
    : `<div class="sub" style="margin-top:6px">Informe quanto você ganha por mês. Assim o app mostra quanto da renda você já gastou e quanto ainda sobra.</div><button class="btn full" style="margin-top:12px" data-act="renda">Definir minha renda</button>`}
  </div>
  ${insightsCard(ins,"Entenda seu mês")}
  <div class="card"><h3>${I("chart-column")}Para onde foi o dinheiro</h3>${gastosCat(l,o)}</div>
  ${resumoMetas()}`;
}

function inicioMEI(){
  const {l,e,o,s}=mes("mei",curYM()), y=cur.getFullYear();
  const doAno=db.mei.lanc.filter(x=>x.tipo==="in" && x.data.startsWith(y+"-"));
  const fat=doAno.reduce((a,x)=>a+x.valor,0), lim=limiteMEI(y), up=pct(fat,lim), cls=up>=90?"bad":up>=75?"warn":"";
  const caixa=db.mei.lanc.filter(x=>x.data.slice(0,7)<=curYM()).reduce((a,x)=>a+(x.tipo==="in"?x.valor:-x.valor),0);
  const margem=e>0?s/e*100:0;
  const cols=[]; let mx=1;
  for(let i=5;i>=0;i--){ const d=new Date(cur.getFullYear(),cur.getMonth()-i,1), r=mes("mei",ymOf(d)); mx=Math.max(mx,r.e,r.o); cols.push({d,r,c:i===0}); }
  const mesesAtivos=new Set(doAno.map(x=>x.data.slice(0,7))).size||1, media=fat/mesesAtivos;
  const restam=y===now.getFullYear()?12-now.getMonth()-1:0;
  const ins=[];
  if(fat>0) ins.push([media*12>lim?"r":"g","trending-up",`Você fatura em média <b>${brl(media)}</b> por mês. Nesse ritmo, fecha o ano com <b>${brl(media*12)}</b>${media*12>lim?", <b>acima do limite do MEI</b>.":", dentro do limite."}`]);
  if(restam>0 && fat<lim) ins.push(["b","scale",`Pra não passar do limite, fature no máximo <b>${brl((lim-fat)/restam)}</b> por mês ${restam>1?`nos ${restam} meses que faltam`:"até o fim do ano"}.`]);
  if(e>0) ins.push([margem>=30?"g":margem>=10?"y":"r","percent",`De cada R$ 100 que entram, sobram <b>${brl(Math.max(margem,0))}</b> de lucro${margem<10?". Reveja custos e preços.":"."}`]);
  ins.push(["y","receipt","O DAS do MEI vence todo <b>dia 20</b>. Lance como despesa na categoria DAS para acompanhar."]);
  if(e>0) ins.push(["b","hand-coins","Separe o dinheiro da empresa do seu. Lance seu salário como <b>Pró-labore</b> aqui e como entrada na área Pessoal."]);
  return `
  <div class="card">
    <div class="label">Lucro do mês</div>
    <div class="big ${s<0?"out-c":""}">${M(s,1)}</div>
    <div class="sub">Margem de ${fp(Math.max(margem,0))} · Caixa total ${M(caixa)}</div>
    <div class="split">
      <div class="pill in"><div class="label">${I("arrow-up-right","s")}Faturou</div><b class="in-c">${M(e,1)}</b></div>
      <div class="pill out"><div class="label">${I("arrow-down-left","s")}Despesas</div><b class="out-c">${M(o,1)}</b></div>
    </div>
    ${hint("Lucro = faturamento menos despesas do mês. Caixa total é todo o dinheiro que sobrou na empresa até agora.")}
  </div>
  ${quick()}
  <div class="card">
    <div class="row between"><h3>${I("landmark")}Limite do MEI em ${y}</h3><button class="link" data-act="limite">Ajustar</button></div>
    <div class="mid" style="margin-top:6px">${M(fat)} <span class="sub">de ${brl(lim)}</span></div>
    ${bar(up,cls)}
    <div class="sub" style="margin-top:8px">${up>=100?`<b class="out-c">Você passou do limite.</b> Procure um contador.`:`Já usou <b>${fp(up)}</b>. Ainda pode faturar <b>${M(lim-fat)}</b> este ano.`}</div>
    ${hint("O MEI só pode faturar até esse valor por ano. Em 2027 o limite sobe para R$ 110 mil.")}
  </div>
  ${insightsCard(ins,"Entenda sua empresa")}
  <div class="card"><h3>${I("chart-column")}Fluxo de caixa · 6 meses</h3>
    <div class="chart">${cols.map(c=>`<div class="col ${c.c?"cur":""}"><div class="bars"><i data-h="${c.r.e/mx*100}" style="height:0"></i><i class="o" data-h="${c.r.o/mx*100}" style="height:0"></i></div><small>${mName(c.d).slice(0,3)}</small></div>`).join("")}</div>
    <div class="legend"><span>Entradas</span><span class="o">Saídas</span></div>
    ${hint("Barra verde maior que a vermelha = mês com lucro.")}
  </div>
  <div class="card"><h3>${I("package")}Despesas por categoria</h3>${gastosCat(l,o)}</div>
  ${resumoMetas()}`;
}

function extrato(){
  let {l,e,o}=mes(area,curYM());
  if(filtro!=="todos") l=l.filter(x=>x.tipo===filtro);
  l=[...l].sort((a,b)=>b.data.localeCompare(a.data));
  let html="", last="";
  l.forEach(x=>{ if(x.data!==last){ last=x.data; const d=new Date(x.data+"T12:00"); const t=d.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}); html+=`<div class="day">${t[0].toUpperCase()+t.slice(1)}</div>`; }
    html+=`<div class="tx">${catIc(x.cat)}<div class="t"><b>${esc(x.desc||x.cat)}</b><span class="sub">${esc(x.cat)}</span></div><div class="v ${x.tipo==="in"?"in-c":"out-c"}">${x.tipo==="in"?"+":"−"} ${M(x.valor)}</div><button class="del" data-del="${x.id}" aria-label="Apagar">${I("trash-2","s")}</button></div>`; });
  return `
  <div class="card"><div class="split" style="margin-top:0">
    <div class="pill in"><div class="label">Entrou</div><b class="in-c">${M(e)}</b></div>
    <div class="pill out"><div class="label">Saiu</div><b class="out-c">${M(o)}</b></div></div></div>
  <div class="filters">${[["todos","Tudo"],["in","Entradas"],["out","Saídas"]].map(([k,t])=>`<button class="chip ${filtro===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div>
  <div class="card">${html || `<div class="empty">${I("receipt-text")}<br>Nada lançado neste mês.<br><br><button class="btn" data-act="in">${I("plus")}Novo lançamento</button></div>`}</div>`;
}

function metas(){
  const ms=db[area].metas;
  const cards=ms.map(m=>{
    const p=pct(m.guardado,m.alvo), falta=Math.max(m.alvo-m.guardado,0);
    let msg=falta<=0?`<b>Meta concluída!</b> Você juntou ${M(m.guardado)}.`:`Faltam <b>${M(falta)}</b> para ${esc(m.nome.toLowerCase())}. Você já juntou <b>${fp(p)}</b> e faltam <b>${fp(100-p)}</b>.`;
    if(falta>0 && m.prazo){ const [Y,Mo]=m.prazo.split("-").map(Number); const n=(Y-now.getFullYear())*12+(Mo-1-now.getMonth()); if(n>0) msg+=`<br>Guardando <b>${brl(falta/n)} por mês</b>, você chega lá em ${MESES[Mo-1]} de ${Y}.`; else msg+=`<br>O prazo já chegou. Que tal definir um novo?`; }
    const head = m.foto
      ? `<div class="cover" style="background-image:url('${m.foto}')"><button class="photo" data-photo="${m.id}" aria-label="Trocar foto">${I("camera","s")}</button><div><h3>${esc(m.nome)}</h3><div class="sub">Meta de ${M(m.alvo)}</div></div></div>`
      : `<div class="cover noimg"><div class="row" style="width:100%">${`<div class="ic" style="background:var(--gold-soft);color:var(--gold)">${I(m.icon||"target")}</div>`}<div><h3>${esc(m.nome)}</h3><div class="sub">Meta de ${M(m.alvo)}</div></div><button class="photo" data-photo="${m.id}" aria-label="Adicionar foto">${I("camera","s")}</button></div></div>`;
    return `<div class="card goal">${head}<div class="body">
      <div class="pctrow"><span class="sub">Progresso</span><span class="pct">${fp(p)}</span></div>${bar(p)}
      <div class="facts"><div><span class="sub">Já juntou</span><b class="in-c">${M(m.guardado)}</b></div><div><span class="sub">Falta</span><b>${M(falta)}</b></div></div>
      <div class="msg">${msg}</div>
      <div class="acts"><button class="btn" data-mv="${m.id}" data-s="1">${I("plus","s")}Guardar</button><button class="btn ghost" data-mv="${m.id}" data-s="-1">Retirar</button><button class="btn ghost" data-delmeta="${m.id}" aria-label="Apagar meta">${I("trash-2","s")}</button></div>
    </div></div>`;}).join("");
  return `${cards || `<div class="card empty">${I("target")}<br><b style="color:var(--ink)">Nenhuma meta ${area==="mei"?"da empresa ":""}ainda</b><br>Crie uma meta, coloque uma foto do que você quer conquistar e acompanhe quanto falta.</div>`}
    <button class="btn full dark" data-new-goal>${I("plus")}Nova meta</button>`;
}

function bindCalc(){
  let exp="";
  const out=document.getElementById("cOut"), ex=document.getElementById("cExp");
  const show=()=>{ out.textContent=exp?exp.replace(/\./g,","):"0"; };
  const ev=s=>{ try{ const js=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-"); if(!/^[\d+\-*/. ]+$/.test(js)) return null; const r=Function(`"use strict";return (${js})`)(); return isFinite(r)?Math.round(r*1e8)/1e8:null; }catch(e){ return null; } };
  document.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k==="C"){ exp=""; ex.textContent=""; }
    else if(k==="⌫") exp=exp.slice(0,-1);
    else if(k==="="){ const r=ev(exp); if(r!==null){ ex.textContent=exp.replace(/\./g,",")+" ="; exp=String(r); } }
    else if(k==="%"){ const m=exp.match(/^(.*?)([+−×÷])?([\d.]+)$/); if(m){ const base=ev(m[1])||0, n=parseFloat(m[3]); exp=m[1]+(m[2]||"")+((m[2]==="+"||m[2]==="−")?Math.round(base*n)/100:n/100); } }
    else if(k===","){ const last=exp.split(/[+−×÷]/).pop(); if(!last.includes(".")) exp+=/\d$/.test(exp)?".":"0."; }
    else if("+−×÷".includes(k)){ if(/[+−×÷]$/.test(exp)) exp=exp.slice(0,-1); if(exp) exp+=k; }
    else exp+=k;
    show();
  });
  const g=id=>document.getElementById(id);
  const tg=()=>{ const a=parse(g("t1").value), h=parse(g("t2").value), n=parseInt(g("t3").value)||0; if(!a){ g("tr").innerHTML="Preencha os campos acima."; return; } const f=Math.max(a-h,0), p=pct(h,a);
    g("tr").innerHTML=(n>0?`Guarde por mês<b class="r">${brl(f/n)}</b>durante ${n} ${n>1?"meses":"mês"}. `:"")+`Você já tem ${fp(p)} do valor e faltam ${fp(100-p)} (${brl(f)}).`; };
  ["t1","t2","t3"].forEach(i=>g(i).oninput=tg);
  const tj=()=>{ const c=parse(g("j1").value), a=parse(g("j2").value), i=parse(g("j3").value)/100, n=parseInt(g("j4").value)||0; if(!n||(!c&&!a)){ g("jr").innerHTML="Preencha os campos acima."; return; }
    let t=c; for(let k=0;k<n;k++) t=t*(1+i)+a; const inv=c+a*n; g("jr").innerHTML=`Em ${n} meses você terá<b class="r">${brl(t)}</b>Você colocou ${brl(inv)} e ganhou ${brl(t-inv)} de rendimento.`; };
  ["j1","j2","j3","j4"].forEach(i=>g(i).oninput=tj);

}

  document.getElementById("admList").onclick=async e=>{ const b=e.target.closest("button"); if(!b) return;
    const set=(id,d)=>saveUser(id,d).then(()=>toast("Atualizado")).catch(x=>toast(errMsg(x)));
    if(b.dataset.approve) set(b.dataset.approve,{aprovado:true,recusado:false});
    if(b.dataset.refuse) set(b.dataset.refuse,{aprovado:false,recusado:true});
    if(b.dataset.revoke) set(b.dataset.revoke,{aprovado:false,recusado:true}); };
}
document.getElementById("adm").onclick=openAdmin;

function boot(){
  
  if(NOAUTH){ startApp(""); return; }
  if(typeof firebase==="undefined"){ gate(`${BRAND}<p class="lead">Sem conexão. Precisamos da internet para abrir o Rendy. Verifique e tente de novo.</p><button class="btn full" onclick="location.reload()">Tentar de novo</button>`); return; }
  firebase.initializeApp(CFG);
  fb={auth:firebase.auth(), fs:firebase.firestore()}; fb.fs.enablePersistence().catch(()=>{}); fb.U=fb.fs.collection("rendy");
  gate(`${BRAND}<p class="lead">Carregando…</p>`);
  fb.auth.onAuthStateChanged(u=>{
    stopWatch(); entered=false; clients=[]; ME=u?{uid:u.uid,email:u.email}:null;
    if(!u){ ADMIN=false; renderAdmin(); return renderLogin(); }
    ADMIN=isAdminEmail(u.email);
    gate(`${BRAND}<p class="lead">Carregando…</p><button class="lk" data-out style="color:#fff">Sair da conta</button>`); bindOut();
    watch.push(fb.U.doc(u.uid).onSnapshot(d=>{
      const me=d.exists?{id:d.id,...d.data()}:null;
      if(!me){ if(!signingUp && !d.metadata.fromCache){ if(ADMIN) saveUser(u.uid,newUser(u.email,"Kaique","")); else renderRequest(); } return; }
      if(isApproved(me)){ if(!entered){ entered=true; startApp(u.uid); if(ADMIN) watch.push(fb.U.onSnapshot(s=>{ clients=s.docs.map(x=>({id:x.id,...x.data()})); renderAdmin(); },()=>{})); } }
      else if(entered) location.reload();
      else renderPending(me);
    },x=>renderLogin(errMsg(x))));
  });
}
boot();
if("serviceWorker" in navigator && location.protocol==="https:" && location.hostname.endsWith("github.io")) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
